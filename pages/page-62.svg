<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS TRANSFIGURATIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VI · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 3 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Anatomie lontane</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Piscofors, Entomorphis e Furitum</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Piscofors conduce alla forma di un pesce: squame, proporzioni e struttura differiscono</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">profondamente dalla forma umana. Il progetto deve essere pensato come trasformazione</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">complessiva, non come semplice sostituzione della pelle.</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Entomorphis induce caratteristiche e comportamento da insetto secondo la descrizione del</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">riferimento. Furitum conduce alla forma di un furetto. In entrambi i casi il limite alla</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">comunicazione rende il controllo della situazione parte integrante dello studio.</text><text x="52" y="309" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Si confrontano tre anatomie per capire perché la piccola taglia del risultato non coincida con</text><text x="52" y="327" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">una bassa difficoltà. Gli allievi lavorano su schemi e non tentano le formule su persone o</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">animali. La capacità di riconoscere un problema viene prima della pretesa di produrlo.</text><rect x="52" y="363" width="491" height="55" fill="#eee9d8"/><path d="M52 363v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="378" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="399" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">L’allievo collega complessità anatomica e controllo senza equiparare piccolezza e facilità.</text><text x="52" y="437" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: 16, Piscofors, Entomorphis e Furitum</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI TRASFIGURAZIONE</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">62</text></svg>