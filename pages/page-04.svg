<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS TRANSFIGURATIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">CURSUS SEPTEM ANNORUM</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Due settimane per anno</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Il ritmo didattico del volume</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Settimana I</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Lezione 1: principi e osservazione. Lezione 2: sviluppo e confronto. Ogni incontro presenta</text><text x="52" y="226" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">una pratica centrale o un caso da interpretare.</text><text x="52" y="263" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Settimana II</text><text x="52" y="287" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Lezione 3: applicazione guidata. Lezione 4: sintesi e ripasso. Concluso il quarto incontro, si</text><text x="52" y="305" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">prosegue con la prima lezione dell’anno successivo.</text><rect x="52" y="323" width="491" height="71" fill="#eee9d8"/><path d="M52 323v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="338" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">QUINDICI MINUTI</text><text x="66" y="359" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">2 minuti per obiettivo e preparazione; 3 per la lettura guidata; 7 per attività o dimostrazione; 3</text><text x="66" y="375" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">per confronto e ripasso.</text><text x="52" y="420" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Conoscenza e applicazione</text><text x="52" y="444" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il programma conserva nome, materia e anno delle formule documentate dalla scuola. Le</text><text x="52" y="462" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">attività del libro accompagnano l’insegnamento senza inventare meccaniche, durate o</text><text x="52" y="480" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">potenziamenti.</text><text x="52" y="510" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Le lezioni mancanti possono essere recuperate consultando teoria e scheda operativa. Non è previsto</text><text x="52" y="528" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">un esame finale.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI TRASFIGURAZIONE</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">04</text></svg>