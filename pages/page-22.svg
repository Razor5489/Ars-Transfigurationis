<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS TRANSFIGURATIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO II · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 3 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">La figura animata</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Vermiculus, Snufflifors e Incarcifors</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Vermiculus e Snufflifors conducono da un piccolo oggetto a una forma animale apparente.</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">La differenza rispetto all’oggetto trasformato in un altro oggetto sta soprattutto nella</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">complessità della struttura: segmenti, zampe, coda e rivestimento richiedono una</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">visualizzazione distinta.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Snufflifors produce una figura di topo e chiede maggiore cura nei dettagli rispetto a una</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">forma vermiforme. Nessuno dei due casi dimostra la creazione di vita naturale. La durata e</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">la stabilità vanno osservate, senza attribuire al risultato emozioni o autonomia non accertate.</text><text x="52" y="327" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Incarcifors trasforma un oggetto in una gabbia: non la evoca dal nulla. Sbarre, base e</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">chiusura devono adattarsi al progetto. È la formula principale dell’incontro, perché permette</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">di verificare direttamente spazio e struttura senza ricorrere a un bersaglio vivente.</text><rect x="52" y="381" width="491" height="55" fill="#eee9d8"/><path d="M52 381v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="396" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="417" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">La gabbia deriva da un bersaglio preciso e conserva proporzioni e chiusura coerenti.</text><text x="52" y="455" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: 6–7</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI TRASFIGURAZIONE</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">22</text></svg>