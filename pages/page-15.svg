<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS TRANSFIGURATIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO I · LECTIO 3</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">L’esercizio e il giudizio</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Aguamenti · Scheda operativa</text><rect x="52" y="165" width="491" height="55" fill="#eee9d8"/><path d="M52 165v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="180" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">PREPARAZIONE</text><text x="66" y="201" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Recipiente predisposto dal docente e spazio di lavoro libero.</text><text x="52" y="239" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">1. Definisci il punto d’arrivo dell’acqua e controlla che non vi siano persone o materiali sul</text><text x="52" y="256" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">percorso.</text><text x="52" y="285" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">2. Segui la dimostrazione di Aguamenti; svolgi un tentativo guidato concentrandoti sulla</text><text x="52" y="302" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">direzione.</text><text x="52" y="331" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">3. Descrivi dove è arrivato l’effetto e se il bersaglio concordato è stato rispettato.</text><rect x="52" y="348" width="491" height="71" fill="#eee9d8"/><path d="M52 348v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="363" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">CONTROLLO</text><text x="66" y="384" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">L’allievo controlla il punto d’arrivo e riferisce il risultato senza inventare proprietà o effetti</text><text x="66" y="400" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">aggiuntivi.</text><text x="52" y="445" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Domanda di ripasso</text><text x="52" y="469" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Produrre più acqua del necessario dimostra automaticamente una maggiore efficacia?</text><text x="52" y="505" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Ragionamento</text><text x="52" y="529" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">No. L’efficacia dipende dalla corrispondenza con il compito assegnato e dal controllo, non dalla</text><text x="52" y="545" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">quantità esibita.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI TRASFIGURAZIONE</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">15</text></svg>