<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS TRANSFIGURATIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO I · SETTIMANA I</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 1 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">La disciplina della forma</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Fondamenti, concentrazione e cinque parametri</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">La Trasfigurazione modifica la forma e le proprietà della materia attraverso un progetto</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">preciso. Prima di impugnare la bacchetta, il trasfiguratore osserva lo stato iniziale, definisce</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">il risultato e decide come verificarlo. Una somiglianza approssimativa non basta: il risultato</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">deve corrispondere all’intenzione.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Cinque parametri guidano la visualizzazione. Lo spazio descrive le dimensioni; la struttura</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">comprende forma e consistenza; il colore identifica la tinta; la tonalità ne definisce</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">sfumature e luminosità. L’essenza, nel modello del manuale, rimane quella del soggetto</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">originario. La concentrazione governa questi parametri, senza costituirne un sesto.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il primo anno introduce Colovaria, Aguamenti e Avis, secondo l’assegnazione delle lezioni</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">della scuola. Il percorso procede dall’osservazione alla variazione cromatica, quindi</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">all’acqua e alle forme aviarie. Non si aggiungono costi, tempi o vantaggi magici che non</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">siano descritti dall’insegnamento effettivo.</text><rect x="52" y="417" width="491" height="71" fill="#eee9d8"/><path d="M52 417v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="432" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="453" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Lo studente distingue i cinque parametri e presenta un risultato atteso che il docente possa</text><text x="66" y="469" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">verificare.</text><text x="52" y="507" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: 2–3, fondamenti. Ordinamento delle formule: lezioni della scuola, primo anno.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI TRASFIGURAZIONE</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">08</text></svg>