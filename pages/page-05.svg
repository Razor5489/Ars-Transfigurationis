<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS TRANSFIGURATIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">FONDAMENTI</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">I cinque parametri</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Visualizzare prima di trasformare</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Spazio</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Altezza, larghezza e profondità del risultato. Una dimensione prevista permette di</text><text x="52" y="226" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">distinguere il progetto da una crescita incontrollata.</text><text x="52" y="263" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Struttura</text><text x="52" y="287" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Forma, consistenza e organizzazione delle parti. Cambiare materiale è diverso da cambiare</text><text x="52" y="305" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">colore.</text><text x="52" y="342" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Colore e tonalità</text><text x="52" y="366" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">La tinta generale va distinta da sfumature, luminosità e dettagli. Una superficie uniforme</text><text x="52" y="384" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">non equivale a un rivestimento ricco di particolari.</text><text x="52" y="421" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Essenza</text><text x="52" y="445" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Nel modello del riferimento rimane l’identità originaria del soggetto. Una forma animale</text><text x="52" y="463" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">apparente non dimostra la creazione di vita naturale.</text><rect x="52" y="481" width="491" height="55" fill="#eee9d8"/><path d="M52 481v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="496" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">CONCENTRAZIONE</text><text x="66" y="517" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Mantiene stabile il progetto mentale e sostiene l’esecuzione; non è un sesto parametro.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI TRASFIGURAZIONE</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">05</text></svg>