<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS TRANSFIGURATIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO I · LECTIO 4</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">L’esercizio e il giudizio</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Avis · Scheda operativa</text><rect x="52" y="165" width="491" height="55" fill="#eee9d8"/><path d="M52 165v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="180" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">PREPARAZIONE</text><text x="66" y="201" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Area libera per la dimostrazione e scheda di osservazione delle forme aviarie.</text><text x="52" y="239" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">1. Descrivi una forma aviaria semplice e individua le parti che devono essere riconoscibili.</text><text x="52" y="268" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">2. Osserva Avis e annota origine, forma e presenza temporanea dell’effetto, senza usarlo contro</text><text x="52" y="285" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">i compagni.</text><text x="52" y="314" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">3. Confronta Colovaria, Aguamenti e Avis: per ciascuno indica il risultato atteso e il controllo</text><text x="52" y="331" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">esercitato.</text><rect x="52" y="348" width="491" height="71" fill="#eee9d8"/><path d="M52 348v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="363" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">CONTROLLO</text><text x="66" y="384" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Lo studente distingue cambiamento cromatico, acqua e apparizione di volatili e riconosce i</text><text x="66" y="400" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">limiti del risultato.</text><text x="52" y="445" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Domanda di ripasso</text><text x="52" y="469" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">La comparsa di uccelli dimostra che è stata trasformata una materia già presente?</text><text x="52" y="505" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Ragionamento</text><text x="52" y="529" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">No. Bisogna conoscere l’origine dell’effetto: Avis viene descritto come apparizione, mentre Avifors</text><text x="52" y="545" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">trasforma un bersaglio.</text><text x="52" y="573" font-family="Georgia, Times New Roman, serif" font-size="9" fill="#ac9258">Fine del ciclo di due settimane. Si prosegue con il II anno.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI TRASFIGURAZIONE</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">18</text></svg>