<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS TRANSFIGURATIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">LEXICON</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Il lessico della forma</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Parole da usare con precisione</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Trasfigurazione</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Modifica di un bersaglio presente secondo un risultato progettato.</text><text x="52" y="244" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Evocazione</text><text x="52" y="268" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Apparizione di un risultato temporaneo; non equivale alla creazione illimitata di vita o risorse.</text><text x="52" y="304" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Animazione</text><text x="52" y="328" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Movimento imposto a un manufatto, senza attribuirgli volontà autonoma.</text><text x="52" y="364" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Detrasfigurazione</text><text x="52" y="388" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Ripristino o correzione di un effetto trasfigurativo.</text><text x="52" y="424" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Potenza, durata, efficacia</text><text x="52" y="448" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Coesione della forma, tempo dell’effetto e corrispondenza al progetto sono criteri distinti.</text><text x="52" y="484" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Chartanimus</text><text x="52" y="508" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Esempio complementare del riferimento: una figura animale di carta conserva l’essenza</text><text x="52" y="525" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">cartacea. Non sostituisce le tre formule del primo anno assegnate dalla scuola.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI TRASFIGURAZIONE</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">76</text></svg>