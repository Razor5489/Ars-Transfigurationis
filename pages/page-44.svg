<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS TRANSFIGURATIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO IV · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 4 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Dimensione e scambio</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Engorgio, Reducio e Diminuendo</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il volume raccoglie tra gli effetti trasfigurativi impercettibili alcune modifiche nelle quali un</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">parametro è visualizzato quasi automaticamente. Engorgio amplia le dimensioni; Reducio è</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">studiato qui come formula di riduzione degli oggetti, mentre Diminuendo compare nel</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">confronto con i bersagli animati.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">La semplicità apparente non elimina la necessità di definire un limite. Un oggetto ingrandito</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">deve restare compatibile con il suo supporto e con l’ambiente. Il progetto deve dire quanto</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">spazio occuperà e come si verificherà il ritorno alle proporzioni iniziali.</text><text x="52" y="327" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Gli incantesimi di scambio trasferiscono contemporaneamente uno o più parametri fra due</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">soggetti. Si distinguono da due trasformazioni indipendenti perché i risultati dipendono</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">l’uno dall’altro. Lo scambio viene affrontato su scheda; il laboratorio riguarda soltanto le</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">proporzioni di un oggetto.</text><rect x="52" y="399" width="491" height="55" fill="#eee9d8"/><path d="M52 399v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="414" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="435" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Le dimensioni sono definite e il confronto distingue scambio simultaneo e modifiche separate.</text><text x="52" y="473" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: 12, impercettibili e scambio</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI TRASFIGURAZIONE</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">44</text></svg>