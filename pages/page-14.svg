<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS TRANSFIGURATIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO I · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 4 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Avis</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">La forma evocata e i suoi limiti</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Avis fa apparire un piccolo stormo di uccelli dalla bacchetta. Le lezioni della scuola lo</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">assegnano al primo anno di Trasfigurazione. Si studia come effetto evocativo: non si parte</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">da un oggetto che viene trasformato davanti all’osservatore.</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">La visualizzazione considera proporzioni, ali, becco e piumaggio. Colore e tonalità</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">contribuiscono alla definizione dell’aspetto, mentre la concentrazione sostiene la coerenza</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">dell’insieme. Il confronto con Avifors verrà approfondito nel terzo anno: Avifors modifica</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">un bersaglio già presente, Avis produce un’apparizione.</text><text x="52" y="327" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il manuale descrive le forme evocate come temporanee e non come creazione di vita</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">naturale. Nel quadro didattico adottato, i limiti di Gamp ricordano che somiglianza non</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">significa autenticità: denaro, cibo, vita, informazioni e amore non si ottengono</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">semplicemente imitandone l’apparenza. L’ultimo incontro conclude le due settimane del</text><text x="52" y="399" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">primo anno.</text><rect x="52" y="417" width="491" height="71" fill="#eee9d8"/><path d="M52 417v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="432" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="453" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Lo studente distingue cambiamento cromatico, acqua e apparizione di volatili e riconosce i</text><text x="66" y="469" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">limiti del risultato.</text><text x="52" y="507" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: 9, Avis; 4–5, Gamp. Collocazione al primo anno: lezioni della scuola.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI TRASFIGURAZIONE</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">14</text></svg>