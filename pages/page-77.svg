<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS TRANSFIGURATIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">APPENDICE · ORDINAMENTO</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Le formule del primo anno</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">L’insegnamento della scuola e la struttura del volume</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Lezioni di Trasfigurazione</text><text x="52" y="208" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Colovaria, Aguamenti e Avis risultano assegnati al primo anno nelle lezioni della scuola. La</text><text x="52" y="226" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">prima settimana prepara il metodo e il mutamento cromatico; la seconda affronta</text><text x="52" y="244" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Aguamenti e Avis, con il ripasso dei limiti.</text><text x="52" y="281" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Il ruolo del riferimento</text><text x="52" y="305" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il libro «Trasfigurazione» costituisce la base teorica. Le lezioni della scuola definiscono</text><text x="52" y="323" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">invece la collocazione delle formule nel programma. Avis viene anticipato al primo anno; il</text><text x="52" y="341" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">confronto con Avifors resta un approfondimento successivo.</text><text x="52" y="378" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Edizione e attribuzione</text><text x="52" y="402" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Ars Transfigurationis è un volume personale di Edmund Valemont, preparato per</text><text x="52" y="420" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">l’esperienza roleplay di NightFall. Le attività sono proposte didattiche originali. I</text><text x="52" y="438" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">riferimenti a personaggi o avvenimenti posteriori al 1890 sono esclusi.</text><text x="52" y="468" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76">Creato per NightFall da Razor. Progetto amatoriale, non ufficiale.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI TRASFIGURAZIONE</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">77</text></svg>