<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS TRANSFIGURATIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VII</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Il programma dell’anno</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Due settimane · Quattro lezioni</text><text x="52" y="184" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Settimana I</text><!--ROW:5--><text x="60" y="208" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Lezione 1 · L’animale e l’identità</text><text x="536" y="208" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">104</text><path d="M60 216H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="52" y="236" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" font-style="italic">Animagus</text><!--ROW:7--><text x="60" y="263" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Lezione 2 · Trasformazioni e maledizioni</text><text x="536" y="263" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">106</text><path d="M60 271H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="52" y="291" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" font-style="italic">Animagus, licantropo e Maledictus</text><text x="52" y="325" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Settimana II</text><!--ROW:10--><text x="60" y="349" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Lezione 3 · Ripristinare la forma umana</text><text x="536" y="349" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">108</text><path d="M60 357H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="52" y="377" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" font-style="italic">L’incantesimo Homosembiante</text><!--ROW:12--><text x="60" y="404" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Lezione 4 · La dote che nasce con il mago</text><text x="536" y="404" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">111</text><path d="M60 412H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="52" y="432" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" font-style="italic">Metamorphomagus e conclusione del volume</text><rect x="52" y="447" width="491" height="71" fill="#eee9d8"/><path d="M52 447v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="462" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">TRAGUARDO</text><text x="66" y="483" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Distinguere capacità apprese, doti innate e maledizioni, senza confonderle con semplici</text><text x="66" y="499" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">incantesimi.</text><text x="52" y="537" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Ogni incontro comprende teoria, spiegazione delle formule ed esercizio. Le schede aggiunte</text><text x="52" y="555" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">appartengono alla stessa lezione. Dopo il quarto incontro si passa all’anno successivo.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI TRASFIGURAZIONE</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">103</text></svg>