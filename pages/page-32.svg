<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS TRANSFIGURATIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO III · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 3 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">Trasformare o evocare</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Avifors, Avis e Farfallus Explodit</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Avis, già studiato nel primo anno, fa apparire uccelli dalla bacchetta. Avifors trasforma</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">invece un bersaglio in una forma di volatile. La differenza non sta soltanto nell’aspetto</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">finale: nel primo caso si osserva un’apparizione temporanea, nel secondo si segue la</text><text x="52" y="231" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">trasformazione di materia presente.</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Becco, ali e piumaggio esigono un progetto accurato. Tonalità e dettagli distinguono un</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">rivestimento credibile da una superficie uniforme. Il volume descrive anche Farfallus</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Explodit, che produce farfalle luminose capaci di distrarre e di rivelare la posizione di chi le</text><text x="52" y="315" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">evoca.</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Si studia la distinzione fra gli effetti senza impiegarli contro compagni. La dimostrazione</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">principale riguarda Avifors su un oggetto noto; gli altri due effetti vengono confrontati</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">attraverso descrizioni guidate.</text><rect x="52" y="399" width="491" height="55" fill="#eee9d8"/><path d="M52 399v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="414" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="435" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">La classificazione dipende dall’origine dell’effetto, non dal solo animale osservato.</text><text x="52" y="473" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: 9–10</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI TRASFIGURAZIONE</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">32</text></svg>