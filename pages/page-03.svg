rmule si trovano nelle rispettive lezioni. Il repertorio raccoglie le voci complementari.</text><text x="52" y="559" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76">L’indice ricercabile permette di trovare ogni incantesimo per nome.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI TRASFIGURAZIONE</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">03</text></svg>