" y="233" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Fondamenti della Trasfigurazione</text><text x="536" y="233" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">05</text><path d="M60 241H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="60" y="261" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Anno I · Fondamenti della forma</text><text x="536" y="261" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">06</text><path d="M60 269H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="60" y="289" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Anno II · La materia e le sue forme</text><text x="536" y="289" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">16</text><path d="M60 297H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="60" y="317" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Anno III · Correggere e distinguere</text><text x="536" y="317" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">26</text><path d="M60 325H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="60" y="345" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Anno IV · Pietra, moto e proporzione</text><text x="536" y="345" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">36</text><path d="M60 353H536" stroke="#c3b89b" stroke-dasharray="1 3" stroke-width=".4"/><text x="60" y="373" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Anno V · L’arte dell’evocazione</text><text x="536" y="373" font-family="Georgia, Times New Roman, serif" font-size="10" fill="#8e8a76" text-anchor="end">46</text><path d="M60 381H536" stroke="#c