<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS TRANSFIGURATIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VI · LECTIO 1</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">L’esercizio e il giudizio</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Studiare il corpo · Scheda operativa</text><rect x="52" y="165" width="491" height="55" fill="#eee9d8"/><path d="M52 165v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="180" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">PREPARAZIONE</text><text x="66" y="201" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Schema della capigliatura e campioni cromatici; attività progettuale.</text><text x="52" y="239" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">1. Definisci il colore iniziale e quello finale senza cambiare il volume dei capelli.</text><text x="52" y="268" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">2. Indica le differenze di tonalità tra radici e punte.</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">3. Presenta al docente il progetto e spiega come riconosceresti un effetto parziale.</text><rect x="52" y="314" width="491" height="55" fill="#eee9d8"/><path d="M52 314v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="329" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">CONTROLLO</text><text x="66" y="350" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Il progetto separa colore e tonalità e riconosce i requisiti della pratica su persone.</text><text x="52" y="395" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Domanda di ripasso</text><text x="52" y="419" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Saper descrivere un nuovo colore basta a padroneggiare la Trasfigurazione umana?</text><text x="52" y="455" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Ragionamento</text><text x="52" y="479" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">No. Restano necessari conoscenza anatomica, controllo, esperienza e preparazione del ripristino.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI TRASFIGURAZIONE</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">59</text></svg>