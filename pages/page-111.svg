<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS TRANSFIGURATIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO VII · SETTIMANA II</text><text x="52" y="72" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#ac9258">LECTIO 4 · TEORIA</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">La dote che nasce con il mago</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Metamorphomagus e conclusione del volume</text><text x="52" y="177" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Il Metamorphomagus possiede fin dalla nascita una rara capacità di modificare il proprio</text><text x="52" y="195" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">aspetto senza bacchetta. Non apprende questa dote nello stesso modo in cui si studia una</text><text x="52" y="213" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">formula e non diventa automaticamente Animagus.</text><text x="52" y="243" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">Lineamenti, colorazione e parti dell’aspetto possono mutare; controllo emotivo e pratica</text><text x="52" y="261" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">aiutano a governare la capacità. Il riferimento distingue la modifica dell’anatomia esterna</text><text x="52" y="279" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">dall’acquisizione di nuove funzioni interne: imitare un tratto animale non equivale a</text><text x="52" y="297" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">possederne tutte le capacità.</text><text x="52" y="327" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">L’Animagus assume una forma animale completa e unica; il Metamorphomagus varia il</text><text x="52" y="345" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">proprio aspetto umano senza diventare per questo un animale completo. Il percorso si</text><text x="52" y="363" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">conclude con un confronto motivato fra trasformazione, evocazione, animazione, abilità e</text><text x="52" y="381" font-family="Georgia, Times New Roman, serif" font-size="12" fill="#283b32">condizione ereditaria: conoscere la differenza è il risultato delle sette annualità.</text><rect x="52" y="399" width="491" height="71" fill="#eee9d8"/><path d="M52 399v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="414" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">OBIETTIVO</text><text x="66" y="435" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">L’allievo distingue dote innata e abilità appresa e conclude il percorso con una classificazione</text><text x="66" y="451" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">ragionata.</text><text x="52" y="489" font-family="Georgia, Times New Roman, serif" font-size="8.5" fill="#8e8a76">Riferimento: 19–20, cap. 4</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI TRASFIGURAZIONE</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">111</text></svg>