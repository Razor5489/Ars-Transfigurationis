<svg xmlns="http://www.w3.org/2000/svg" width="595" height="842" viewBox="0 0 595 842"><defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".7" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="paper" width="595" height="842" patternUnits="userSpaceOnUse"><rect width="595" height="842" filter="url(#grain)" opacity=".17"/></pattern><linearGradient id="leather"><stop stop-color="#072a22"/><stop offset=".12" stop-color="#19483b"/><stop offset=".6" stop-color="#103c30"/><stop offset="1" stop-color="#05261e"/></linearGradient></defs><rect width="595" height="842" fill="#f8f4e8"/><rect width="595" height="842" fill="url(#paper)" opacity=".17"/><text x="52" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76">ARS TRANSFIGURATIONIS</text><text x="543" y="38" font-family="Georgia, Times New Roman, serif" font-size="7" fill="#8e8a76" text-anchor="end">ANNO II · LECTIO 2</text><path d="M52 48H543" stroke="#ac9258" stroke-width=".7"/><text x="52" y="109" font-family="Georgia, Times New Roman, serif" font-size="26" fill="#153f33" font-weight="bold">L’esercizio e il giudizio</text><text x="52" y="141" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#8e8a76" font-style="italic">Apparenza e consistenza · Scheda operativa</text><rect x="52" y="165" width="491" height="55" fill="#eee9d8"/><path d="M52 165v55" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="180" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">PREPARAZIONE</text><text x="66" y="201" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Due campioni separati e identificati; uno riservato alla dimostrazione di Malum.</text><text x="52" y="239" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">1. Annota quali proprietà rendono credibile una mela e perché non ne provano la</text><text x="52" y="256" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">commestibilità.</text><text x="52" y="285" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">2. Su un campione predisposto, progetta una sola modifica della consistenza.</text><text x="52" y="314" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">3. Applica Gommosus sotto guida e confronta la risposta del materiale con quella iniziale.</text><rect x="52" y="331" width="491" height="71" fill="#eee9d8"/><path d="M52 331v71" stroke="#ac9258" stroke-width="1.5"/><text x="66" y="346" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#153f33" font-weight="bold">CONTROLLO</text><text x="66" y="367" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">L’allievo distingue forma, consistenza e proprietà autentiche senza considerare commestibile</text><text x="66" y="383" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">il risultato di Malum.</text><text x="52" y="428" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Domanda di ripasso</text><text x="52" y="452" font-family="Georgia, Times New Roman, serif" font-size="11.5" fill="#283b32">Un campione mantiene colore e sagoma ma diventa elastico: la trasformazione è fallita?</text><text x="52" y="488" font-family="Georgia, Times New Roman, serif" font-size="15" fill="#153f33" font-weight="bold">Ragionamento</text><text x="52" y="512" font-family="Georgia, Times New Roman, serif" font-size="11" fill="#283b32">Non necessariamente: se questo era il progetto di Gommosus, il parametro modificato è la struttura.</text><path d="M52 789H543" stroke="#c3b89b" stroke-width=".45"/><text x="52" y="804" font-family="Georgia, Times New Roman, serif" font-size="6.5" fill="#8e8a76">MANUALE DIDATTICO DI TRASFIGURAZIONE</text><text x="543" y="804" font-family="Georgia, Times New Roman, serif" font-size="8" fill="#8e8a76" text-anchor="end">21</text></svg>