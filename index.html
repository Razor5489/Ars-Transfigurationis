<script id="book-data" type="application/json">{"pages":[{"image":"pages/page-01.svg?v=20261121-cover2","text":"ARS TRANSFIGURATIONIS\nTractatus de Arte Transfigurationis\nEdmund Valemont\nHogwarts · 1890","title":"Copertina","folio":"Copertina","kind":"cover"},{"image":"pages/page-02.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nPraefatio\nL’arte della forma\nPrefazione di Edmund Valemont\nPrefazione di Edmund Valemont\nLa Trasfigurazione comincia prima del gesto: comincia quando sappiamo osservare. Un buon trasfiguratore non impone alla materia un desiderio confuso; prepara un’immagine precisa e ne riconosce i limiti.\nQuesto volume accompagna sette annualità. Ogni anno si svolge in due settimane, con due lezioni per settimana: quattro incontri prima di procedere all’anno successivo.\nIl metodo comune\nLe pagine teoriche introducono principi e formule. La scheda successiva organizza preparazione, attività e controllo. Ogni incontro ha un obiettivo riconoscibile e termina con una domanda ragionata.\nLa sequenza di lavoro\nOsservare. Visualizzare. Eseguire con controllo. Confrontare. Correggere.\nLa teoria non conferisce automaticamente abilità speciali. Gli argomenti avanzati si affrontano secondo la preparazione degli allievi e le indicazioni della scuola.\nEdmund Valemont","title":"L’arte della forma","folio":"02","kind":"theory"},{"image":"pages/page-03.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nTabula Materiarum\nIndice del volume\nSette anni · Ventotto lezioni\nSette anni · Ventotto lezioni\nPrefazione 2\nIl percorso delle due settimane 4\nFondamenti · I cinque parametri 5\nAnno I · Fondamenti della forma 6\nAnno II · La materia e le sue forme 19\nAnno III · Correggere e distinguere 37\nAnno IV · Pietra, moto e proporzione 53\nAnno V · L’arte dell’evocazione 69\nAnno VI · La forma umana 83\nAnno VII · Identità e metamorfosi 102\nLessico essenziale 113\nRepertorio delle formule · Schede distinte 115\nFinis 116\nLe schede delle formule si trovano nelle rispettive lezioni. Il repertorio raccoglie le voci complementari. L’indice ricercabile permette di trovare ogni incantesimo per nome.","title":"Indice del volume","folio":"03","kind":"theory"},{"image":"pages/page-04.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nCursus Septem Annorum\nDue settimane per anno\nIl ritmo didattico del volume\nIl ritmo didattico del volume\nSettimana I\nLezione 1: principi e osservazione. Lezione 2: sviluppo e confronto. Ogni incontro presenta una pratica centrale o un caso da interpretare.\nSettimana II\nLezione 3: applicazione guidata. Lezione 4: sintesi e ripasso. Concluso il quarto incontro, si prosegue con la prima lezione dell’anno successivo.\nQuindici minuti\n2 minuti per obiettivo e preparazione; 3 per la lettura guidata; 7 per attività o dimostrazione; 3 per confronto e ripasso.\nConoscenza e applicazione\nIl programma conserva nome, materia e anno delle formule documentate dalla scuola. Le attività del libro accompagnano l’insegnamento senza inventare meccaniche, durate o potenziamenti.\nLe lezioni mancanti possono essere recuperate consultando teoria e scheda operativa. Non è previsto un esame finale.","title":"Due settimane per anno","folio":"04","kind":"theory"},{"image":"pages/page-05.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nFondamenti\nI cinque parametri\nVisualizzare prima di trasformare\nVisualizzare prima di trasformare\nSpazio\nAltezza, larghezza e profondità del risultato. Una dimensione prevista permette di distinguere il progetto da una crescita incontrollata.\nStruttura\nForma, consistenza e organizzazione delle parti. Cambiare materiale è diverso da cambiare colore.\nColore e tonalità\nLa tinta generale va distinta da sfumature, luminosità e dettagli. Una superficie uniforme non equivale a un rivestimento ricco di particolari.\nEssenza\nNel modello del riferimento rimane l’identità originaria del soggetto. Una forma animale apparente non dimostra la creazione di vita naturale.\nConcentrazione\nMantiene stabile il progetto mentale e sostiene l’esecuzione; non è un sesto parametro.","title":"I cinque parametri","folio":"05","kind":"theory"},{"image":"pages/page-06.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno I\nFondamenti della forma\nAnnus Primus\nAnnus Primus\nOsservare la materia, visualizzare il risultato e riconoscere i limiti della trasformazione.\nIl ciclo dell’annualità\nDue settimane. Due lezioni ogni settimana. Quattro incontri. Le schede delle formule sono letture della stessa lezione, non incontri aggiuntivi.\nLe formule del primo anno: Colovaria, Aguamenti, Avis.","title":"Fondamenti della forma","folio":"06","kind":"divider"},{"image":"pages/page-07.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno I\nIl programma dell’anno\nDue settimane · Quattro lezioni\nDue settimane · Quattro lezioni\nSettimana I\nLezione 1 · La disciplina della forma 8\nFondamenti, concentrazione e cinque parametri\nLezione 2 · Colovaria 10\nIl governo del colore\nSettimana II\nLezione 3 · Aguamenti 13\nAcqua, direzione e controllo\nLezione 4 · Avis 16\nLa forma evocata e i suoi limiti\nTraguardo\nOsservare la materia, visualizzare il risultato e riconoscere i limiti della trasformazione.\nOgni incontro comprende teoria, spiegazione delle formule ed esercizio. Le schede aggiunte appartengono alla stessa lezione. Dopo il quarto incontro si passa all’anno successivo.","title":"Il programma dell’anno","folio":"07","kind":"theory"},{"image":"pages/page-08.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno I · Settimana I\nLa disciplina della forma\nFondamenti, concentrazione e cinque parametri\nFondamenti, concentrazione e cinque parametri\nLa Trasfigurazione modifica la forma e le proprietà della materia attraverso un progetto preciso. Prima di impugnare la bacchetta, il trasfiguratore osserva lo stato iniziale, definisce il risultato e decide come verificarlo. Una somiglianza approssimativa non basta: il risultato deve corrispondere all’intenzione.\nCinque parametri guidano la visualizzazione. Lo spazio descrive le dimensioni; la struttura comprende forma e consistenza; il colore identifica la tinta; la tonalità ne definisce sfumature e luminosità. L’essenza, nel modello del manuale, rimane quella del soggetto originario. La concentrazione governa questi parametri, senza costituirne un sesto.\nIl primo anno introduce Colovaria, Aguamenti e Avis, secondo l’assegnazione delle lezioni della scuola. Il percorso procede dall’osservazione alla variazione cromatica, quindi all’acqua e alle forme aviarie. Non si aggiungono costi, tempi o vantaggi magici che non siano descritti dall’insegnamento effettivo.\nObiettivo\nLo studente distingue i cinque parametri e presenta un risultato atteso che il docente possa verificare.\nRiferimento: 2–3, fondamenti. Ordinamento delle formule: lezioni della scuola, primo anno.","title":"La disciplina della forma","folio":"08","kind":"theory"},{"image":"pages/page-09.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno I · Lectio 1\nL’esercizio e il giudizio\nLa disciplina della forma · Scheda operativa\nLa disciplina della forma · Scheda operativa\nPreparazione\nUn oggetto semplice, una pergamena e una scheda dei cinque parametri.\n1. Descrivi dimensioni, forma, consistenza e tinta del bersaglio senza modificarlo.\n2. Compila cinque righe, una per parametro; distingui ciò che cambia da ciò che deve restare invariato.\n3. Progetta una modifica del solo colore e confrontala con una modifica della struttura.\nControllo\nLo studente distingue i cinque parametri e presenta un risultato atteso che il docente possa verificare.\nDomanda di ripasso\nUna scatola diventa blu senza cambiare forma: quale parametro è stato modificato?\nRagionamento\nIl colore. Dimensioni e struttura devono rimanere quelle previste; la tonalità va confrontata con la finitura richiesta.","title":"La disciplina della forma · Esercizio e ripasso","folio":"09","kind":"theory"},{"image":"pages/page-10.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno I · Settimana I\nColovaria\nIl governo del colore\nIl governo del colore\nColovaria è la formula dedicata al mutamento cromatico. L’esercizio comincia scegliendo una tinta riconoscibile su un oggetto semplice: una sola modifica permette di osservare il risultato senza confonderlo con cambiamenti di forma o dimensione.\nColore e tonalità devono essere distinti. Il colore è la tinta generale; la tonalità riguarda gradazioni, luminosità e sfumature. Un oggetto può assumere il colore desiderato e conservare tuttavia zone irregolari, che richiedono una nuova osservazione prima di ripetere il tentativo.\nLa formula è collocata al primo anno nelle lezioni della scuola. La pratica conserva il bersaglio iniziale e modifica soltanto quanto stabilito con il docente. Non si deducono dalla variazione cromatica cambiamenti di materiale, poteri aggiuntivi o durata illimitata. Gesto e pronuncia vengono appresi nella dimostrazione.\nObiettivo\nLa tinta corrisponde al progetto, la superficie è coerente e il bersaglio conserva forma e dimensioni.\nRiferimento: 2–3, parametri. Formula e anno: lezioni della scuola, voce Colovaria.","title":"Colovaria","folio":"10","kind":"theory"},{"image":"pages/page-11.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno I · Lectio 2\nColovaria\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nCambia il colore del bersaglio. La variazione cromatica si distingue da una trasformazione della forma, delle dimensioni o del materiale.\nNozioni da spiegare\nColore e tonalità non coincidono: il primo identifica la tinta; la seconda ne descrive sfumature e luminosità. Una colorazione uniforme richiede attenzione alle diverse superfici.\nEsempio da discutere in aula\nScegliere un oggetto chiaro e una tinta precisa. Far descrivere quali parametri devono cambiare e quali devono restare invariati.\nDomanda alla classe\nUn oggetto blu ma deformato rispetta un progetto soltanto cromatico?\nRisposta ragionata\nNo. Il colore può essere corretto mentre la struttura è stata modificata senza essere richiesta.","title":"Colovaria","folio":"11","kind":"spell"},{"image":"pages/page-12.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno I · Lectio 2\nL’esercizio e il giudizio\nColovaria · Scheda operativa\nColovaria · Scheda operativa\nPreparazione\nUn oggetto neutro predisposto dal docente e un riferimento cromatico.\n1. Annota il colore iniziale e scegli una tinta finale precisa.\n2. Visualizza la colorazione, mantenendo invariati spazio e struttura; esegui Colovaria secondo la dimostrazione.\n3. Confronta le diverse superfici del risultato e descrivi eventuali zone rimaste del colore iniziale.\nControllo\nLa tinta corrisponde al progetto, la superficie è coerente e il bersaglio conserva forma e dimensioni.\nDomanda di ripasso\nUn oggetto cambia colore ma diventa anche più grande: il progetto cromatico è stato rispettato?\nRagionamento\nNo. Un cambiamento di spazio non previsto costituisce una deviazione, anche quando la tinta è corretta.","title":"Colovaria · Esercizio e ripasso","folio":"12","kind":"theory"},{"image":"pages/page-13.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno I · Settimana II\nAguamenti\nAcqua, direzione e controllo\nAcqua, direzione e controllo\nAguamenti viene studiato nel primo anno di Trasfigurazione, come stabilito dalle lezioni della scuola. La formula è associata alla produzione di acqua: il suo uso didattico mette al centro la direzione dell’effetto e la capacità di mantenere il controllo sul risultato.\nIl lavoro si prepara con un recipiente e una zona sgombra. La destinazione dell’acqua deve essere individuata prima dell’esecuzione; la supervisione del docente accompagna avvio, controllo e conclusione dell’effetto. Non occorre aumentare la quantità per dimostrare una migliore padronanza.\nQuesto incontro collega l’osservazione ai limiti della magia. La presenza di acqua non consente di attribuire alla formula proprietà curative o potenziamenti non descritti. Pronuncia, gesto e controllo dell’intensità si apprendono nella dimostrazione del docente: il progetto deve restare commisurato al compito assegnato.\nObiettivo\nL’allievo controlla il punto d’arrivo e riferisce il risultato senza inventare proprietà o effetti aggiuntivi.\nRiferimento: Lezioni della scuola, primo anno, voce Aguamenti. Attività guidata proposta per questa edizione.","title":"Aguamenti","folio":"13","kind":"theory"},{"image":"pages/page-14.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno I · Lectio 3\nAguamenti\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nFa scaturire acqua dalla bacchetta. Nel programma della scuola è una formula di Trasfigurazione del primo anno.\nNozioni da spiegare\nLa comparsa dell’acqua si distingue dalla trasformazione di un oggetto visibile. Il docente collega origine, direzione e destinazione dell’effetto al tema dell’evocazione.\nEsempio da discutere in aula\nPredisporre un recipiente. Chiedere quale sia la destinazione dell’acqua e perché la quantità debba rispondere al compito, anziché essere aumentata per esibizione.\nDomanda alla classe\nProdurre acqua dimostra che un oggetto sia stato trasformato?\nRisposta ragionata\nNo. Bisogna ricostruire l’origine dell’effetto; la sola presenza finale dell’acqua non dimostra una trasformazione di materia individuata.","title":"Aguamenti","folio":"14","kind":"spell"},{"image":"pages/page-15.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno I · Lectio 3\nL’esercizio e il giudizio\nAguamenti · Scheda operativa\nAguamenti · Scheda operativa\nPreparazione\nRecipiente predisposto dal docente e spazio di lavoro libero.\n1. Definisci il punto d’arrivo dell’acqua e controlla che non vi siano persone o materiali sul percorso.\n2. Segui la dimostrazione di Aguamenti; svolgi un tentativo guidato concentrandoti sulla direzione.\n3. Descrivi dove è arrivato l’effetto e se il bersaglio concordato è stato rispettato.\nControllo\nL’allievo controlla il punto d’arrivo e riferisce il risultato senza inventare proprietà o effetti aggiuntivi.\nDomanda di ripasso\nProdurre più acqua del necessario dimostra automaticamente una maggiore efficacia?\nRagionamento\nNo. L’efficacia dipende dalla corrispondenza con il compito assegnato e dal controllo, non dalla quantità esibita.","title":"Aguamenti · Esercizio e ripasso","folio":"15","kind":"theory"},{"image":"pages/page-16.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno I · Settimana II\nAvis\nLa forma evocata e i suoi limiti\nLa forma evocata e i suoi limiti\nAvis fa apparire un piccolo stormo di uccelli dalla bacchetta. Le lezioni della scuola lo assegnano al primo anno di Trasfigurazione. Si studia come effetto evocativo: non si parte da un oggetto che viene trasformato davanti all’osservatore.\nLa visualizzazione considera proporzioni, ali, becco e piumaggio. Colore e tonalità contribuiscono alla definizione dell’aspetto, mentre la concentrazione sostiene la coerenza dell’insieme. Il confronto con Avifors verrà approfondito nel terzo anno: Avifors modifica un bersaglio già presente, Avis produce un’apparizione.\nIl manuale descrive le forme evocate come temporanee e non come creazione di vita naturale. Nel quadro didattico adottato, i limiti di Gamp ricordano che somiglianza non significa autenticità: denaro, cibo, vita, informazioni e amore non si ottengono semplicemente imitandone l’apparenza. L’ultimo incontro conclude le due settimane del primo anno.\nObiettivo\nLo studente distingue cambiamento cromatico, acqua e apparizione di volatili e riconosce i limiti del risultato.\nRiferimento: 9, Avis; 4–5, Gamp. Collocazione al primo anno: lezioni della scuola.","title":"Avis","folio":"16","kind":"theory"},{"image":"pages/page-17.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno I · Lectio 4\nAvis\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nFa apparire uccelli dalla bacchetta. Nel modello didattico del volume l’apparizione è temporanea e viene distinta dalla trasformazione di un bersaglio presente.\nNozioni da spiegare\nBecco, ali e piumaggio aiutano a riconoscere la forma aviaria. Il confronto con Avifors riguarda soprattutto l’origine del risultato, non soltanto il suo aspetto.\nEsempio da discutere in aula\nFar disegnare due sequenze: bacchetta e apparizione; oggetto iniziale e forma di volatile. Confrontare ciò che manca o cambia nelle due descrizioni.\nDomanda alla classe\nQuale elemento distingue Avis da Avifors?\nRisposta ragionata\nAvis è studiato come apparizione; Avifors come trasformazione di un bersaglio già presente.","title":"Avis","folio":"17","kind":"spell"},{"image":"pages/page-18.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno I · Lectio 4\nL’esercizio e il giudizio\nAvis · Scheda operativa\nAvis · Scheda operativa\nPreparazione\nArea libera per la dimostrazione e scheda di osservazione delle forme aviarie.\n1. Descrivi una forma aviaria semplice e individua le parti che devono essere riconoscibili.\n2. Osserva Avis e annota origine, forma e presenza temporanea dell’effetto, senza usarlo contro i compagni.\n3. Confronta Colovaria, Aguamenti e Avis: per ciascuno indica il risultato atteso e il controllo esercitato.\nControllo\nLo studente distingue cambiamento cromatico, acqua e apparizione di volatili e riconosce i limiti del risultato.\nDomanda di ripasso\nLa comparsa di uccelli dimostra che è stata trasformata una materia già presente?\nRagionamento\nNo. Bisogna conoscere l’origine dell’effetto: Avis viene descritto come apparizione, mentre Avifors trasforma un bersaglio.\nFine del ciclo di due settimane. Si prosegue con il II anno.","title":"Avis · Esercizio e ripasso","folio":"18","kind":"theory"},{"image":"pages/page-19.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno II\nLa materia e le sue forme\nAnnus Secundus\nAnnus Secundus\nPassare dall’oggetto alla forma desiderata e valutare la qualità del risultato.\nIl ciclo dell’annualità\nDue settimane. Due lezioni ogni settimana. Quattro incontri. Le schede delle formule sono letture della stessa lezione, non incontri aggiuntivi.","title":"La materia e le sue forme","folio":"19","kind":"divider"},{"image":"pages/page-20.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno II\nIl programma dell’anno\nDue settimane · Quattro lezioni\nDue settimane · Quattro lezioni\nSettimana I\nLezione 1 · Dall’oggetto all’ago 21\nTrasfigurazione inanimata · Acutus\nLezione 2 · Apparenza e consistenza 24\nMalum e Gommosus\nSettimana II\nLezione 3 · La figura animata 28\nVermiculus, Snufflifors e Incarcifors\nLezione 4 · Valutare una trasformazione 33\nFeraverto, Inferacus e le tre caratteristiche\nTraguardo\nPassare dall’oggetto alla forma desiderata e valutare la qualità del risultato.\nOgni incontro comprende teoria, spiegazione delle formule ed esercizio. Le schede aggiunte appartengono alla stessa lezione. Dopo il quarto incontro si passa all’anno successivo.","title":"Il programma dell’anno","folio":"20","kind":"theory"},{"image":"pages/page-21.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno II · Settimana I\nDall’oggetto all’ago\nTrasfigurazione inanimata · Acutus\nTrasfigurazione inanimata · Acutus\nLa Trasfigurazione inanimata parte da un soggetto privo di vita naturale. Può condurre a un altro oggetto oppure a una forma animata apparente. In entrambi i casi, secondo il modello del volume, l’essenza resta quella di partenza.\nAcutus produce un piccolo ago. Occorre visualizzare un corpo sottile, un’estremità appuntita e una cruna riconoscibile: il colore metallico da solo non basta. La riduzione dello spazio e la precisione della struttura devono essere progettate insieme.\nUna punta non rende automaticamente riuscita la trasfigurazione: l’ago deve avere proporzioni coerenti e una superficie uniforme. Si lavora su un vassoio e si osserva il risultato senza portarlo vicino al viso.\nObiettivo\nPunta, corpo e cruna sono distinguibili; dimensioni e materiale corrispondono al progetto.\nRiferimento: 5, Acutus","title":"Dall’oggetto all’ago","folio":"21","kind":"theory"},{"image":"pages/page-22.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno II · Lectio 1\nAcutus\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nNel riferimento trasforma un piccolo oggetto in un ago, con punta e cruna riconoscibili.\nNozioni da spiegare\nLa forma utile richiede più della somiglianza metallica: sottigliezza, continuità del corpo e proporzioni della cruna definiscono la struttura.\nEsempio da discutere in aula\nConfrontare un disegno di ago e un semplice bastoncino appuntito. Chiedere quali caratteristiche manchino al secondo per corrispondere al progetto.\nDomanda alla classe\nIl solo colore argentato dimostra una trasfigurazione riuscita?\nRisposta ragionata\nNo. Devono essere riconoscibili struttura e proporzioni dell’ago, oltre al colore.","title":"Acutus","folio":"22","kind":"spell"},{"image":"pages/page-23.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno II · Lectio 1\nL’esercizio e il giudizio\nDall’oggetto all’ago · Scheda operativa\nDall’oggetto all’ago · Scheda operativa\nPreparazione\nPiccolo oggetto predisposto dal docente, vassoio e scheda dei parametri.\n1. Descrivi il bersaglio iniziale e disegna l’ago con punta e cruna.\n2. Indica quali parametri cambieranno e quali rimarranno invariati.\n3. Esegui Acutus sotto guida; confronta il risultato con il disegno senza maneggiarne la punta.\nControllo\nPunta, corpo e cruna sono distinguibili; dimensioni e materiale corrispondono al progetto.\nDomanda di ripasso\nOttieni una sottile barretta d’argento priva di cruna: che cosa manca?\nRagionamento\nLa struttura funzionale dell’ago; il colore e la sottigliezza non sono sufficienti.","title":"Dall’oggetto all’ago · Esercizio e ripasso","folio":"23","kind":"theory"},{"image":"pages/page-24.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno II · Settimana I\nApparenza e consistenza\nMalum e Gommosus\nMalum e Gommosus\nMalum trasforma un oggetto in una mela apparente, non commestibile. Buccia, profilo e sfumature danno verosimiglianza, ma l’essenza iniziale non diventa quella di un alimento. Questo esempio applica il limite già studiato nel primo anno.\nGommosus rende morbida ed elastica una superficie o un oggetto. Qui la modifica centrale riguarda la consistenza della struttura, mentre il profilo e la colorazione possono restare riconoscibili. Le due formule mostrano che una trasformazione può essere evidente alla vista oppure rilevante soprattutto per le proprietà del materiale.\nIl confronto va eseguito su bersagli distinti, evitando di sovrapporre effetti senza averli prima compresi. Nel laboratorio si privilegia Gommosus; Malum viene osservato in dimostrazione e descritto nella scheda.\nObiettivo\nL’allievo distingue forma, consistenza e proprietà autentiche senza considerare commestibile il risultato di Malum.\nRiferimento: 5–6, Malum e Gommosus","title":"Apparenza e consistenza","folio":"24","kind":"theory"},{"image":"pages/page-25.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno II · Lectio 2\nMalum\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nNel modello del riferimento trasforma un oggetto in una mela apparente. L’aspetto ottenuto non la rende un alimento commestibile.\nNozioni da spiegare\nProfilo, buccia e sfumature riguardano l’apparenza. Il manuale usa l’esempio per distinguere una forma imitata dalle proprietà autentiche di ciò che rappresenta.\nEsempio da discutere in aula\nDescrivere una mela vera e una forma trasfigurata senza assaggiarle. Separare le qualità osservabili dalle proprietà che il solo aspetto non dimostra.\nDomanda alla classe\nUna forma che sembra un frutto può essere considerata cibo?\nRisposta ragionata\nNo. La somiglianza non basta; nel modello del volume la mela ottenuta non è destinata al consumo.","title":"Malum","folio":"25","kind":"spell"},{"image":"pages/page-26.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno II · Lectio 2\nGommosus\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nRende il bersaglio morbido ed elastico secondo la descrizione del riferimento. Modifica soprattutto la consistenza della struttura.\nNozioni da spiegare\nUna proprietà può cambiare anche quando colore e profilo restano simili. È utile distinguere elasticità, rigidità e forma invece di usare soltanto la vista.\nEsempio da discutere in aula\nConfrontare, su descrizione o campioni predisposti, un oggetto rigido e uno elastico. Far spiegare quale parametro sia stato modificato.\nDomanda alla classe\nSe il colore resta uguale, la trasformazione può essere riuscita?\nRisposta ragionata\nSì. Il progetto riguarda la consistenza; il colore non è il parametro principale.","title":"Gommosus","folio":"26","kind":"spell"},{"image":"pages/page-27.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno II · Lectio 2\nL’esercizio e il giudizio\nApparenza e consistenza · Scheda operativa\nApparenza e consistenza · Scheda operativa\nPreparazione\nDue campioni separati e identificati; uno riservato alla dimostrazione di Malum.\n1. Annota quali proprietà rendono credibile una mela e perché non ne provano la commestibilità.\n2. Su un campione predisposto, progetta una sola modifica della consistenza.\n3. Applica Gommosus sotto guida e confronta la risposta del materiale con quella iniziale.\nControllo\nL’allievo distingue forma, consistenza e proprietà autentiche senza considerare commestibile il risultato di Malum.\nDomanda di ripasso\nUn campione mantiene colore e sagoma ma diventa elastico: la trasformazione è fallita?\nRagionamento\nNon necessariamente: se questo era il progetto di Gommosus, il parametro modificato è la struttura.","title":"Apparenza e consistenza · Esercizio e ripasso","folio":"27","kind":"theory"},{"image":"pages/page-28.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno II · Settimana II\nLa figura animata\nVermiculus, Snufflifors e Incarcifors\nVermiculus, Snufflifors e Incarcifors\nVermiculus e Snufflifors conducono da un piccolo oggetto a una forma animale apparente. La differenza rispetto all’oggetto trasformato in un altro oggetto sta soprattutto nella complessità della struttura: segmenti, zampe, coda e rivestimento richiedono una visualizzazione distinta.\nSnufflifors produce una figura di topo e chiede maggiore cura nei dettagli rispetto a una forma vermiforme. Nessuno dei due casi dimostra la creazione di vita naturale. La durata e la stabilità vanno osservate, senza attribuire al risultato emozioni o autonomia non accertate.\nIncarcifors trasforma un oggetto in una gabbia: non la evoca dal nulla. Sbarre, base e chiusura devono adattarsi al progetto. È la formula principale dell’incontro, perché permette di verificare direttamente spazio e struttura senza ricorrere a un bersaglio vivente.\nObiettivo\nLa gabbia deriva da un bersaglio preciso e conserva proporzioni e chiusura coerenti.\nRiferimento: 6–7","title":"La figura animata","folio":"28","kind":"theory"},{"image":"pages/page-29.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno II · Lectio 3\nVermiculus\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nNel riferimento conduce un piccolo oggetto a una forma vermiforme apparente.\nNozioni da spiegare\nLa semplicità del profilo non elimina il lavoro su segmenti, proporzioni e movimento. La forma animata viene distinta dalla creazione di vita naturale.\nEsempio da discutere in aula\nConfrontare il disegno di una forma vermiforme con quello di un topo. Individuare quali parti rendano più complesso il secondo progetto.\nDomanda alla classe\nUna forma che si muove prova la creazione di un animale naturale?\nRisposta ragionata\nNo. Nel modello didattico il movimento è un effetto magico e non dimostra una nuova essenza.","title":"Vermiculus","folio":"29","kind":"spell"},{"image":"pages/page-30.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno II · Lectio 3\nSnufflifors\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nTrasforma un piccolo oggetto in una figura di topo secondo il riferimento del corso.\nNozioni da spiegare\nMuso, zampe, coda e rivestimento devono appartenere a una struttura coerente. La taglia ridotta non rende automaticamente semplice il progetto.\nEsempio da discutere in aula\nFar annotare le parti riconoscibili della forma finale e confrontarle con la disposizione iniziale dell’oggetto.\nDomanda alla classe\nPerché una coda corretta non basta a definire un topo riuscito?\nRisposta ragionata\nPerché il risultato richiede proporzioni e rapporti coerenti tra tutte le parti.","title":"Snufflifors","folio":"30","kind":"spell"},{"image":"pages/page-31.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno II · Lectio 3\nIncarcifors\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nTrasforma un oggetto già presente in una gabbia. L’origine materiale lo distingue dall’apparizione di funi.\nNozioni da spiegare\nBase, sbarre e chiusura definiscono una struttura; uno spazio apparentemente circondato non equivale a un contenitore completo.\nEsempio da discutere in aula\nDisegnare una gabbia partendo dalle dimensioni del bersaglio iniziale. Chiedere quali parti rendano verificabile il progetto.\nDomanda alla classe\nIncarcifors evoca una gabbia senza bersaglio iniziale?\nRisposta ragionata\nNo. Nel riferimento modifica un oggetto presente.","title":"Incarcifors","folio":"31","kind":"spell"},{"image":"pages/page-32.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno II · Lectio 3\nL’esercizio e il giudizio\nLa figura animata · Scheda operativa\nLa figura animata · Scheda operativa\nPreparazione\nOggetto semplice, disegno di una piccola gabbia; figure animali in dimostrazione.\n1. Confronta le difficoltà di una forma vermiforme e di un topo sulla scheda dei parametri.\n2. Disegna una gabbia con base, sbarre e chiusura; individua l’oggetto da trasformare.\n3. Esegui Incarcifors sul bersaglio predisposto e verifica la completezza della struttura.\nControllo\nLa gabbia deriva da un bersaglio preciso e conserva proporzioni e chiusura coerenti.\nDomanda di ripasso\nQuale differenza separa Incarcifors da una formula che fa apparire corde dalla bacchetta?\nRagionamento\nIncarcifors trasforma materia già presente; l’apparizione di corde appartiene all’evocazione.","title":"La figura animata · Esercizio e ripasso","folio":"32","kind":"theory"},{"image":"pages/page-33.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno II · Settimana II\nValutare una trasformazione\nFeraverto, Inferacus e le tre caratteristiche\nFeraverto, Inferacus e le tre caratteristiche\nPotenza, durata ed efficacia descrivono aspetti diversi del risultato. La potenza sostiene la coesione della forma; la durata indica per quanto tempo l’effetto rimane attivo; l’efficacia esprime quanto il risultato corrisponde al progetto.\nFeraverto trasforma un piccolo animale in un calice. Nel quadro del manuale, il liquido apparente non va bevuto. Un calice che conserva piume è un esempio di efficacia incompleta, anche se rimane stabile per un certo tempo.\nInferacus trasforma un riccio o un porcospino in un portaspilli: corpo e aculei devono essere ripensati insieme. Gli esempi su animali vengono affidati al docente; l’allievo conclude l’anno con un’analisi diagnostica e con il confronto fra i parametri iniziali e finali.\nObiettivo\nIl giudizio finale distingue le tre caratteristiche e motiva almeno un difetto osservabile.\nRiferimento: 7–8","title":"Valutare una trasformazione","folio":"33","kind":"theory"},{"image":"pages/page-34.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno II · Lectio 4\nFeraverto\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nTrasforma un piccolo animale in un calice. Il corso ne prevede l’osservazione guidata e l’analisi del risultato.\nNozioni da spiegare\nResidui della forma iniziale, come piume o dettagli corporei, indicano una trasformazione incompleta. La stabilità nel tempo e la correttezza della forma sono criteri diversi.\nEsempio da discutere in aula\nMostrare il disegno di un calice con caratteristiche residue. Far individuare quali parametri non corrispondano alla forma richiesta.\nDomanda alla classe\nUn calice stabile ma coperto di piume è completamente riuscito?\nRisposta ragionata\nNo. La durata dell’effetto non corregge l’incompletezza della struttura.","title":"Feraverto","folio":"34","kind":"spell"},{"image":"pages/page-35.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno II · Lectio 4\nInferacus\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nNel riferimento trasforma un riccio o un porcospino in un portaspilli.\nNozioni da spiegare\nLa relazione tra aculei e funzione del risultato rende visibile il legame tra forma iniziale e progetto finale. Corpo, appoggio e superficie vanno ripensati insieme.\nEsempio da discutere in aula\nConfrontare su scheda la distribuzione degli aculei con quella delle parti del portaspilli. L’esercizio resta diagnostico.\nDomanda alla classe\nPerché non basta cambiare soltanto la sagoma esterna?\nRisposta ragionata\nPerché il progetto riguarda anche disposizione e funzione delle parti, oltre al profilo.","title":"Inferacus","folio":"35","kind":"spell"},{"image":"pages/page-36.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno II · Lectio 4\nL’esercizio e il giudizio\nValutare una trasformazione · Scheda operativa\nValutare una trasformazione · Scheda operativa\nPreparazione\nSchede illustrate di risultati completi e incompleti; dimostrazione del docente.\n1. Osserva un calice con residui della forma iniziale e descrivi il difetto.\n2. Separa il giudizio sull’efficacia da quello sulla durata.\n3. Confronta Feraverto e Inferacus e indica che cosa resta invariato nell’essenza.\nControllo\nIl giudizio finale distingue le tre caratteristiche e motiva almeno un difetto osservabile.\nDomanda di ripasso\nUna trasformazione dura a lungo, ma non corrisponde alla forma richiesta: quale caratteristica è insufficiente?\nRagionamento\nL’efficacia. Una lunga durata non rende corretto un risultato difettoso.\nFine del ciclo di due settimane. Si prosegue con il III anno.","title":"Valutare una trasformazione · Esercizio e ripasso","folio":"36","kind":"theory"},{"image":"pages/page-37.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno III\nCorreggere e distinguere\nAnnus Tertius\nAnnus Tertius\nRipristinare la forma, distinguere trasformazione ed evocazione e controllare l’ambiente.\nIl ciclo dell’annualità\nDue settimane. Due lezioni ogni settimana. Quattro incontri. Le schede delle formule sono letture della stessa lezione, non incontri aggiuntivi.","title":"Correggere e distinguere","folio":"37","kind":"divider"},{"image":"pages/page-38.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno III\nIl programma dell’anno\nDue settimane · Quattro lezioni\nDue settimane · Quattro lezioni\nSettimana I\nLezione 1 · Ritrovare la forma iniziale 39\nDetrasfigurazione · Reparifarge\nLezione 2 · Un bersaglio, due origini 42\nLapifors e gli incantesimi bivalenti\nSettimana II\nLezione 3 · Trasformare o evocare 45\nAvifors, Avis e Farfallus Explodit\nLezione 4 · Controllo e difesa 49\nGlisseo, Furunculus e recupero della lucidità\nTraguardo\nRipristinare la forma, distinguere trasformazione ed evocazione e controllare l’ambiente.\nOgni incontro comprende teoria, spiegazione delle formule ed esercizio. Le schede aggiunte appartengono alla stessa lezione. Dopo il quarto incontro si passa all’anno successivo.","title":"Il programma dell’anno","folio":"38","kind":"theory"},{"image":"pages/page-39.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno III · Settimana I\nRitrovare la forma iniziale\nDetrasfigurazione · Reparifarge\nDetrasfigurazione · Reparifarge\nLa Detrasfigurazione riguarda il ripristino o la correzione degli effetti trasfigurativi. Il riferimento essenziale resta la forma di partenza: senza conoscerla è difficile distinguere un recupero corretto da un’ulteriore modifica.\nReparifarge è presentato dal volume come la formula che restituisce la forma iniziale a una trasfigurazione mal riuscita. Chi ha eseguito il primo tentativo possiede spesso un vantaggio: conosce il bersaglio e il progetto che non è stato realizzato.\nNon si devono considerare tutte le formule di cessazione intercambiabili. Prima di intervenire occorre riconoscere la natura dell’effetto e affidare al docente i casi complessi. L’esercizio di oggi usa solo un oggetto trasformato in modo incompleto e predisposto per il ripristino.\nObiettivo\nIl ripristino corrisponde allo stato documentato e non lascia modifiche evidenti.\nRiferimento: 8, cap. 1","title":"Ritrovare la forma iniziale","folio":"39","kind":"theory"},{"image":"pages/page-40.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno III · Lectio 1\nReparifarge\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nRipristina la forma iniziale di un bersaglio trasfigurato in modo incompleto o scorretto, secondo il riferimento.\nNozioni da spiegare\nDetrasfigurare richiede di conoscere ciò che c’era prima. Il ripristino di una forma si distingue dalla ricomposizione materiale di un oggetto rotto.\nEsempio da discutere in aula\nAffiancare il disegno iniziale e quello di una trasfigurazione incompleta. Far indicare quali proprietà debbano essere recuperate.\nDomanda alla classe\nReparifarge e Reparo rispondono necessariamente allo stesso problema?\nRisposta ragionata\nNo. Il primo riguarda qui una trasfigurazione da correggere; il secondo ricompone un oggetto danneggiato.","title":"Reparifarge","folio":"40","kind":"spell"},{"image":"pages/page-41.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno III · Lectio 1\nL’esercizio e il giudizio\nRitrovare la forma iniziale · Scheda operativa\nRitrovare la forma iniziale · Scheda operativa\nPreparazione\nOggetto di prova, descrizione o disegno del suo stato originario.\n1. Ricostruisci i cinque parametri iniziali prima di toccare il risultato incompleto.\n2. Individua e descrivi le parti che non corrispondono alla forma originaria.\n3. Esegui Reparifarge sotto guida e confronta nuovamente il bersaglio con la scheda.\nControllo\nIl ripristino corrisponde allo stato documentato e non lascia modifiche evidenti.\nDomanda di ripasso\nPerché il disegno iniziale è utile anche a chi non ha lanciato la prima formula?\nRagionamento\nFornisce un riferimento verificabile per ricostruire i parametri della forma da recuperare.","title":"Ritrovare la forma iniziale · Esercizio e ripasso","folio":"41","kind":"theory"},{"image":"pages/page-42.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno III · Settimana I\nUn bersaglio, due origini\nLapifors e gli incantesimi bivalenti\nLapifors e gli incantesimi bivalenti\nUn incantesimo bivalente agisce su due categorie di soggetti. Lapifors può trasformare un oggetto o un animale in un coniglio: il risultato esteriore può essere simile, ma il punto di partenza cambia la difficoltà del progetto.\nPartire da un animale offre una struttura già organizzata in parti corporee. Partire da un oggetto richiede di immaginare una disposizione molto diversa: orecchie, zampe, manto e proporzioni non possono essere lasciati indefiniti.\nL’essenza rimane quella iniziale in entrambi i casi. Per questo osservare solo il risultato non basta a ricostruire ciò che è accaduto. Il lavoro della classe riguarda un oggetto predisposto; il confronto con un animale resta una dimostrazione guidata.\nObiettivo\nL’allievo riconosce la bivalenza e collega la difficoltà al bersaglio iniziale.\nRiferimento: 8–9, Lapifors","title":"Un bersaglio, due origini","folio":"42","kind":"theory"},{"image":"pages/page-43.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno III · Lectio 2\nLapifors\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nTrasforma un oggetto o un animale in una forma di coniglio secondo il testo di riferimento.\nNozioni da spiegare\nÈ detto bivalente perché ammette due categorie di origine. La stessa forma finale può richiedere progetti diversi quando la struttura iniziale cambia.\nEsempio da discutere in aula\nConfrontare una scatola e un piccolo animale come punti di partenza soltanto su scheda. Elencare proporzioni e parti da ripensare.\nDomanda alla classe\nLa stessa forma finale dimostra che la difficoltà iniziale fosse uguale?\nRisposta ragionata\nNo. Conoscere il risultato non basta: conta anche il bersaglio di partenza.","title":"Lapifors","folio":"43","kind":"spell"},{"image":"pages/page-44.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno III · Lectio 2\nL’esercizio e il giudizio\nUn bersaglio, due origini · Scheda operativa\nUn bersaglio, due origini · Scheda operativa\nPreparazione\nOggetto semplice e due schede che descrivono origini differenti.\n1. Disegna una figura di coniglio con proporzioni esplicite.\n2. Compila due progetti: uno da oggetto, uno da animale, senza eseguire il secondo.\n3. Analizza una dimostrazione di Lapifors e indica il passaggio strutturale più complesso.\nControllo\nL’allievo riconosce la bivalenza e collega la difficoltà al bersaglio iniziale.\nDomanda di ripasso\nDue risultati identici hanno necessariamente la stessa essenza?\nRagionamento\nNo. Nel modello del manuale l’essenza dipende dal soggetto originario e rimane invariata.","title":"Un bersaglio, due origini · Esercizio e ripasso","folio":"44","kind":"theory"},{"image":"pages/page-45.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno III · Settimana II\nTrasformare o evocare\nAvifors, Avis e Farfallus Explodit\nAvifors, Avis e Farfallus Explodit\nAvis, già studiato nel primo anno, fa apparire uccelli dalla bacchetta. Avifors trasforma invece un bersaglio in una forma di volatile. La differenza non sta soltanto nell’aspetto finale: nel primo caso si osserva un’apparizione temporanea, nel secondo si segue la trasformazione di materia presente.\nBecco, ali e piumaggio esigono un progetto accurato. Tonalità e dettagli distinguono un rivestimento credibile da una superficie uniforme. Il volume descrive anche Farfallus Explodit, che produce farfalle luminose capaci di distrarre e di rivelare la posizione di chi le evoca.\nSi studia la distinzione fra gli effetti senza impiegarli contro compagni. La dimostrazione principale riguarda Avifors su un oggetto noto; gli altri due effetti vengono confrontati attraverso descrizioni guidate.\nObiettivo\nLa classificazione dipende dall’origine dell’effetto, non dal solo animale osservato.\nRiferimento: 9–10","title":"Trasformare o evocare","folio":"45","kind":"theory"},{"image":"pages/page-46.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno III · Lectio 3\nAvifors\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nTrasforma un bersaglio presente in una forma di volatile.\nNozioni da spiegare\nIl risultato può somigliare agli uccelli di Avis, ma la sequenza ha un’origine differente. Ali, becco e piumaggio devono essere pensati in relazione alla materia iniziale.\nEsempio da discutere in aula\nRicostruire il prima e il dopo di un oggetto trasformato. Far spiegare come si possa distinguere la trasformazione da un’apparizione.\nDomanda alla classe\nPer classificare l’effetto basta vedere un uccello alla fine?\nRisposta ragionata\nNo. Occorre sapere se una materia già presente sia stata trasformata.","title":"Avifors","folio":"46","kind":"spell"},{"image":"pages/page-47.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno III · Lectio 3\nFarfallus Explodit\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nNel riferimento produce farfalle luminose, descritte come effetto capace di distrarre e rendere riconoscibile la posizione di chi lo evoca.\nNozioni da spiegare\nLa luminosità è una proprietà osservabile. Distrazione e riconoscibilità dipendono dalla situazione e non giustificano l’attribuzione di altri effetti al nome della formula.\nEsempio da discutere in aula\nDiscutere perché una manifestazione luminosa possa attirare l’attenzione sia sull’effetto sia sulla sua origine.\nDomanda alla classe\nDal nome si può dedurre un’esplosione con effetti non descritti?\nRisposta ragionata\nNo. Si conserva la descrizione fornita dal riferimento, senza ricavare altri poteri dalla denominazione.","title":"Farfallus Explodit","folio":"47","kind":"spell"},{"image":"pages/page-48.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno III · Lectio 3\nL’esercizio e il giudizio\nTrasformare o evocare · Scheda operativa\nTrasformare o evocare · Scheda operativa\nPreparazione\nOggetto identificato; schede di confronto delle tre formule.\n1. Segui visivamente il bersaglio iniziale durante la dimostrazione di Avifors.\n2. Segna se il risultato deriva da una trasformazione o da un’apparizione.\n3. Confronta Avis e Farfallus Explodit indicando quale effetto renderebbe visibile una posizione nascosta.\nControllo\nLa classificazione dipende dall’origine dell’effetto, non dal solo animale osservato.\nDomanda di ripasso\nVedi uno stormo: che cosa devi sapere per distinguere Avis da Avifors?\nRagionamento\nDevi sapere se era presente un bersaglio trasformato oppure se lo stormo è apparso dalla bacchetta.","title":"Trasformare o evocare · Esercizio e ripasso","folio":"48","kind":"theory"},{"image":"pages/page-49.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno III · Settimana II\nControllo e difesa\nGlisseo, Furunculus e recupero della lucidità\nGlisseo, Furunculus e recupero della lucidità\nGlisseo converte una scala in uno scivolo: l’effetto riguarda soprattutto la struttura della superficie. L’area occupata può restare simile, ma la funzione cambia completamente. È un esempio di trasformazione dell’ambiente che richiede di prevedere le conseguenze del movimento.\nFurunculus è descritto come una fattura che provoca eruzioni sulla pelle. Si riconosce teoricamente e non si sperimenta sui compagni. Il confronto ricorda che un piccolo cambiamento visibile può avere effetti rilevanti sul bersaglio.\nIl volume tratta anche la difesa quando una trasformazione impedisce la parola. La concentrazione e la magia non verbale richiedono preparazione avanzata: il terzo anno non ne garantisce la padronanza. Fermarsi, conservare lucidità e richiedere l’intervento del docente resta la procedura dell’esercizio.\nObiettivo\nL’allievo collega forma, funzione e controllo dell’ambiente e riconosce i propri limiti di preparazione.\nRiferimento: 8, difesa; 10, Glisseo e Furunculus","title":"Controllo e difesa","folio":"49","kind":"theory"},{"image":"pages/page-50.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno III · Lectio 4\nGlisseo\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nTrasforma una scala in uno scivolo, modificando la struttura e la funzione della superficie.\nNozioni da spiegare\nUno spazio simile può diventare percorribile in modo diverso. Il mutamento strutturale ha conseguenze sul movimento di chi lo attraversa.\nEsempio da discutere in aula\nConfrontare due sezioni disegnate, gradini e piano inclinato. Far descrivere ciò che cambia nella funzione oltre che nell’aspetto.\nDomanda alla classe\nSe l’area occupata resta simile, la trasformazione è irrilevante?\nRisposta ragionata\nNo. La funzione e le condizioni del movimento cambiano profondamente.","title":"Glisseo","folio":"50","kind":"spell"},{"image":"pages/page-51.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno III · Lectio 4\nFurunculus\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nConfronto teorico · effetti offensivi\nChe cosa fa\nProvoca eruzioni o foruncoli sulla pelle. Viene riconosciuto come fattura attraverso lo studio teorico.\nNozioni da spiegare\nUn’alterazione visibile del corpo non è un semplice esercizio estetico. La voce è un confronto con gli effetti offensivi, da tenere distinto dalla pratica trasfigurativa.\nEsempio da discutere in aula\nAnalizzare una descrizione scritta e chiedere perché un cambiamento limitato della superficie possa avere conseguenze sul bersaglio.\nDomanda alla classe\nLa piccola estensione visibile rende l’effetto trascurabile?\nRisposta ragionata\nNo. La dimensione della zona modificata non misura da sola le conseguenze.","title":"Furunculus","folio":"51","kind":"spell"},{"image":"pages/page-52.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno III · Lectio 4\nL’esercizio e il giudizio\nControllo e difesa · Scheda operativa\nControllo e difesa · Scheda operativa\nPreparazione\nModello da tavolo di una scala e casi scritti; nessun passaggio praticato da persone.\n1. Descrivi come cambia la funzione di una scala sotto Glisseo.\n2. Individua il rischio per chi si trova sulla superficie durante il cambiamento.\n3. Risolvi un caso scritto spiegando perché un allievo non deve presumere di saper detrasfigurare senza parola.\nControllo\nL’allievo collega forma, funzione e controllo dell’ambiente e riconosce i propri limiti di preparazione.\nDomanda di ripasso\nUn effetto modifica poco lo spazio: significa che le conseguenze sono trascurabili?\nRagionamento\nNo. La trasformazione della struttura o della funzione può avere conseguenze rilevanti anche senza aumento di dimensioni.\nFine del ciclo di due settimane. Si prosegue con il IV anno.","title":"Controllo e difesa · Esercizio e ripasso","folio":"52","kind":"theory"},{"image":"pages/page-53.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno IV\nPietra, moto e proporzione\nAnnus Quartus\nAnnus Quartus\nComprendere litotrasfigurazione, animazione, variazioni di dimensione e scambio.\nIl ciclo dell’annualità\nDue settimane. Due lezioni ogni settimana. Quattro incontri. Le schede delle formule sono letture della stessa lezione, non incontri aggiuntivi.","title":"Pietra, moto e proporzione","folio":"53","kind":"divider"},{"image":"pages/page-54.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno IV\nIl programma dell’anno\nDue settimane · Quattro lezioni\nDue settimane · Quattro lezioni\nSettimana I\nLezione 1 · La materia di pietra 55\nLitotrasfigurazione · Duro\nLezione 2 · Dare moto ai manufatti 58\nTrasfigurazione d’animazione\nSettimana II\nLezione 3 · La forma draconica 61\nDraconifors e il controllo di una figura complessa\nLezione 4 · Dimensione e scambio 64\nEngorgio, Reducio e Diminuendo\nTraguardo\nComprendere litotrasfigurazione, animazione, variazioni di dimensione e scambio.\nOgni incontro comprende teoria, spiegazione delle formule ed esercizio. Le schede aggiunte appartengono alla stessa lezione. Dopo il quarto incontro si passa all’anno successivo.","title":"Il programma dell’anno","folio":"54","kind":"theory"},{"image":"pages/page-55.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno IV · Settimana I\nLa materia di pietra\nLitotrasfigurazione · Duro\nLitotrasfigurazione · Duro\nLa litotrasfigurazione comprende trasformazioni nelle quali la pietra compare come materiale iniziale o finale. Il termine identifica una relazione con la materia, non un’autorizzazione a modificare indiscriminatamente qualsiasi bersaglio.\nDuro indurisce o rende pietroso l’oggetto colpito. Nel modello del riferimento, lo spazio resta invariato e l’attenzione si concentra sulla consistenza. La somiglianza cromatica con la pietra non dimostra da sola che il materiale sia stato trasformato correttamente.\nLa complessità aumenta con le dimensioni del bersaglio. Il laboratorio usa un campione piccolo e separato dagli arredi: occorre distinguere il progetto intenzionale dagli effetti che una modifica della consistenza avrebbe sull’uso quotidiano dell’oggetto.\nObiettivo\nLa descrizione distingue consistenza e apparenza e non attribuisce cambiamenti a parametri rimasti invariati.\nRiferimento: 10–11, litotrasfigurazione e Duro","title":"La materia di pietra","folio":"55","kind":"theory"},{"image":"pages/page-56.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno IV · Lectio 1\nDuro\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nIndurisce il bersaglio o gli conferisce una consistenza pietrosa secondo il riferimento.\nNozioni da spiegare\nRigidità e colore sono proprietà diverse. Un oggetto che sembra pietra non dimostra da solo una variazione di consistenza, così come un colore invariato non la esclude.\nEsempio da discutere in aula\nConfrontare su scheda un tessuto flessibile e il suo risultato irrigidito. Far indicare quale proprietà sia centrale.\nDomanda alla classe\nQuale parametro è prioritario: colore o struttura?\nRisposta ragionata\nLa struttura, in particolare la consistenza prevista dal progetto.","title":"Duro","folio":"56","kind":"spell"},{"image":"pages/page-57.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno IV · Lectio 1\nL’esercizio e il giudizio\nLa materia di pietra · Scheda operativa\nLa materia di pietra · Scheda operativa\nPreparazione\nCampione piccolo predisposto dal docente e supporto di osservazione.\n1. Annota forma, colore e consistenza iniziali.\n2. Progetta l’indurimento senza modificare le dimensioni del campione.\n3. Osserva Duro in esecuzione guidata e verifica quali proprietà sono cambiate.\nControllo\nLa descrizione distingue consistenza e apparenza e non attribuisce cambiamenti a parametri rimasti invariati.\nDomanda di ripasso\nUn campione è grigio come una pietra ma ancora flessibile: quale verifica manca?\nRagionamento\nLa verifica della consistenza, cioè della modifica strutturale richiesta.","title":"La materia di pietra · Esercizio e ripasso","folio":"57","kind":"theory"},{"image":"pages/page-58.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno IV · Settimana I\nDare moto ai manufatti\nTrasfigurazione d’animazione\nTrasfigurazione d’animazione\nAnimare un manufatto significa conferirgli movimento governato dalla magia. Non significa attribuirgli vita, coscienza o volontà autonoma. Il progetto deve includere non soltanto la forma ferma, ma anche il modo in cui le sue parti possono muoversi.\nUn’armatura è composta da parti articolabili e presenta cavità interne. Una statua ricavata da un blocco pieno oppone una struttura differente alla visualizzazione del movimento. Il confronto aiuta a capire perché la forma iniziale determina il carico di concentrazione.\nIl riferimento presenta Piertotum Locomotor come formula d’animazione. Per l’allievo il principio guida è un bersaglio, un comando semplice e un percorso previsto. La lezione si svolge come dimostrazione del docente, senza animare arredi occupati o strutture della scuola.\nObiettivo\nIl comando è univoco e la descrizione non attribuisce intenzioni proprie al manufatto.\nRiferimento: 11–12, animazione","title":"Dare moto ai manufatti","folio":"58","kind":"theory"},{"image":"pages/page-59.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno IV · Lectio 2\nPiertotum Locomotor\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nAnima statue o armature e ne permette il movimento secondo il comando impartito.\nNozioni da spiegare\nAnimazione non significa vita o coscienza. La presenza di articolazioni, cavità e parti mobili influenza il progetto del movimento.\nEsempio da discutere in aula\nConfrontare una statua piena e un’armatura articolata. Far spiegare perché lo stesso comando richieda visualizzazioni differenti.\nDomanda alla classe\nUn manufatto che esegue un comando ha acquisito volontà propria?\nRisposta ragionata\nNo. Il movimento osservato non dimostra coscienza o vita naturale.","title":"Piertotum Locomotor","folio":"59","kind":"spell"},{"image":"pages/page-60.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno IV · Lectio 2\nL’esercizio e il giudizio\nDare moto ai manufatti · Scheda operativa\nDare moto ai manufatti · Scheda operativa\nPreparazione\nPiccolo manufatto da dimostrazione e disegno del percorso.\n1. Individua le parti che dovrebbero articolarsi prima del movimento.\n2. Scrivi un comando unico, breve e verificabile.\n3. Osserva la dimostrazione e controlla se il manufatto esegue soltanto il compito previsto.\nControllo\nIl comando è univoco e la descrizione non attribuisce intenzioni proprie al manufatto.\nDomanda di ripasso\nUna statua esegue un ordine: quale prova manca per considerarla viva?\nRagionamento\nIl movimento imposto non dimostra vita o coscienza; l’animazione è un effetto governato dal mago.","title":"Dare moto ai manufatti · Esercizio e ripasso","folio":"60","kind":"theory"},{"image":"pages/page-61.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno IV · Settimana II\nLa forma draconica\nDraconifors e il controllo di una figura complessa\nDraconifors e il controllo di una figura complessa\nDraconifors viene presentato nel riferimento come animazione di una figura di drago. Il suo studio riunisce litotrasfigurazione e movimento: ali, coda, arti e proporzioni devono essere pensati come un insieme.\nUna forma complessa non diventa gestibile soltanto perché è piccola. Ogni parte in movimento richiede un progetto coerente e una concentrazione continua; ingrandire il bersaglio prima della trasformazione rende ancora più impegnativo il controllo.\nIn questa edizione l’argomento rimane teorico, con analisi di un modello statico. Non si riprendono le attribuzioni storiche novecentesche presenti nel libro di partenza, incompatibili con la datazione del corso. L’obiettivo è riconoscere difficoltà e limiti, senza promettere abilità avanzate agli allievi.\nObiettivo\nL’allievo motiva la complessità senza confondere l’animazione di una figura con la creazione di un drago naturale.\nRiferimento: 10–11, Draconifors","title":"La forma draconica","folio":"61","kind":"theory"},{"image":"pages/page-62.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno IV · Lectio 3\nDraconifors\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nNel riferimento anima una figura di drago. Il corso affronta il rapporto tra la forma draconica e il movimento delle sue parti.\nNozioni da spiegare\nAli, coda e arti devono funzionare come insieme. Il testo viene seguito nella sua specifica interpretazione, senza attribuire altre capacità alla sola somiglianza con un drago.\nEsempio da discutere in aula\nStudiare un modello statico e individuare quali parti richiedano un movimento coordinato. L’incontro rimane teorico.\nDomanda alla classe\nUna figura piccola è necessariamente facile da animare?\nRisposta ragionata\nNo. La complessità dipende anche dal numero e dalla relazione delle parti da governare.","title":"Draconifors","folio":"62","kind":"spell"},{"image":"pages/page-63.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno IV · Lectio 3\nL’esercizio e il giudizio\nLa forma draconica · Scheda operativa\nLa forma draconica · Scheda operativa\nPreparazione\nFigura draconica statica e disegno dei suoi possibili movimenti.\n1. Segna sul disegno le parti che richiederebbero articolazione.\n2. Confronta un semplice passo con il volo e spiega quale progetto richieda più controllo.\n3. Indica come un aumento di dimensioni inciderebbe sul compito del trasfiguratore.\nControllo\nL’allievo motiva la complessità senza confondere l’animazione di una figura con la creazione di un drago naturale.\nDomanda di ripasso\nPerché ingrandire prima il modello non rende automaticamente migliore la trasformazione?\nRagionamento\nAumenta l’estensione del bersaglio e il controllo necessario; la grandezza non corregge un progetto incompleto.","title":"La forma draconica · Esercizio e ripasso","folio":"63","kind":"theory"},{"image":"pages/page-64.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno IV · Settimana II\nDimensione e scambio\nEngorgio, Reducio e Diminuendo\nEngorgio, Reducio e Diminuendo\nIl volume raccoglie tra gli effetti trasfigurativi impercettibili alcune modifiche nelle quali un parametro è visualizzato quasi automaticamente. Engorgio amplia le dimensioni; Reducio è studiato qui come formula di riduzione degli oggetti, mentre Diminuendo compare nel confronto con i bersagli animati.\nLa semplicità apparente non elimina la necessità di definire un limite. Un oggetto ingrandito deve restare compatibile con il suo supporto e con l’ambiente. Il progetto deve dire quanto spazio occuperà e come si verificherà il ritorno alle proporzioni iniziali.\nGli incantesimi di scambio trasferiscono contemporaneamente uno o più parametri fra due soggetti. Si distinguono da due trasformazioni indipendenti perché i risultati dipendono l’uno dall’altro. Lo scambio viene affrontato su scheda; il laboratorio riguarda soltanto le proporzioni di un oggetto.\nObiettivo\nLe dimensioni sono definite e il confronto distingue scambio simultaneo e modifiche separate.\nRiferimento: 12, impercettibili e scambio","title":"Dimensione e scambio","folio":"64","kind":"theory"},{"image":"pages/page-65.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno IV · Lectio 4\nEngorgio\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nIngrandisce il bersaglio. Nel progetto si osservano soprattutto dimensioni e proporzioni.\nNozioni da spiegare\nUn aumento di spazio può rendere inadatto l’appoggio iniziale. Ingrandire non significa acquisire nuove proprietà magiche o cambiare automaticamente materiale.\nEsempio da discutere in aula\nDisegnare un oggetto sul suo supporto e una versione ingrandita. Chiedere quali ingombri debbano essere previsti prima della prova.\nDomanda alla classe\nUn oggetto più grande ha automaticamente nuovi poteri?\nRisposta ragionata\nNo. Il cambiamento di dimensione non dimostra proprietà ulteriori.","title":"Engorgio","folio":"65","kind":"spell"},{"image":"pages/page-66.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno IV · Lectio 4\nReducio\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nRiduce le dimensioni del bersaglio; viene confrontato con Engorgio e con il ritorno alle proporzioni previste.\nNozioni da spiegare\nRimpicciolire riguarda lo spazio occupato. La riduzione va distinta dalla trasformazione in un materiale diverso o dalla scomparsa del bersaglio.\nEsempio da discutere in aula\nConfrontare misure iniziali, ingrandite e ridotte di un oggetto. Far descrivere il risultato desiderato senza usare soltanto “più piccolo”.\nDomanda alla classe\nRidurre significa far scomparire?\nRisposta ragionata\nNo. Il bersaglio rimane presente con dimensioni modificate.","title":"Reducio","folio":"66","kind":"spell"},{"image":"pages/page-67.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno IV · Lectio 4\nDiminuendo\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nNel riferimento riduce il bersaglio ed è richiamato nel confronto con soggetti animati.\nNozioni da spiegare\nUna somiglianza di risultato non rende tutte le formule equivalenti per bersagli e condizioni. La distinzione si conserva senza estendere automaticamente le applicazioni di Reducio.\nEsempio da discutere in aula\nConfrontare due descrizioni, una su oggetto e una su soggetto animato. Individuare quali informazioni servano prima di scegliere una formula.\nDomanda alla classe\nUn effetto simile autorizza a usare indifferentemente due formule?\nRisposta ragionata\nNo. Occorre conoscere bersaglio ammesso, contesto e condizioni insegnate.","title":"Diminuendo","folio":"67","kind":"spell"},{"image":"pages/page-68.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno IV · Lectio 4\nL’esercizio e il giudizio\nDimensione e scambio · Scheda operativa\nDimensione e scambio · Scheda operativa\nPreparazione\nPiccolo oggetto, riferimento dimensionale e due schede per lo scambio.\n1. Fissa una dimensione finale prima della dimostrazione di Engorgio.\n2. Confronta l’oggetto con il riferimento e descrivi il ripristino guidato con Reducio.\n3. Progetta su carta uno scambio di colore tra due oggetti e indica perché deve essere simultaneo.\nControllo\nLe dimensioni sono definite e il confronto distingue scambio simultaneo e modifiche separate.\nDomanda di ripasso\nColorare due oggetti in momenti diversi dimostra uno scambio?\nRagionamento\nNo. Lo scambio richiede la relazione simultanea tra i parametri dei due soggetti.\nFine del ciclo di due settimane. Si prosegue con il V anno.","title":"Dimensione e scambio · Esercizio e ripasso","folio":"68","kind":"theory"},{"image":"pages/page-69.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno V\nL’arte dell’evocazione\nAnnus Quintus\nAnnus Quintus\nProgettare apparizioni temporanee e distinguere gli effetti di formule affini.\nIl ciclo dell’annualità\nDue settimane. Due lezioni ogni settimana. Quattro incontri. Le schede delle formule sono letture della stessa lezione, non incontri aggiuntivi.","title":"L’arte dell’evocazione","folio":"69","kind":"divider"},{"image":"pages/page-70.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno V\nIl programma dell’anno\nDue settimane · Quattro lezioni\nDue settimane · Quattro lezioni\nSettimana I\nLezione 1 · Portare all’esistenza 71\nEvocazione ed evanescenza\nLezione 2 · Un bouquet temporaneo 73\nOrchideus\nSettimana II\nLezione 3 · Congiunzione e contenimento 76\nEpoximise e Incarcerous\nLezione 4 · Leggere un effetto ambiguo 80\nMelofors e sintesi dell’evocazione\nTraguardo\nProgettare apparizioni temporanee e distinguere gli effetti di formule affini.\nOgni incontro comprende teoria, spiegazione delle formule ed esercizio. Le schede aggiunte appartengono alla stessa lezione. Dopo il quarto incontro si passa all’anno successivo.","title":"Il programma dell’anno","folio":"70","kind":"theory"},{"image":"pages/page-71.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno V · Settimana I\nPortare all’esistenza\nEvocazione ed evanescenza\nEvocazione ed evanescenza\nL’evocazione fa apparire un oggetto senza trasformare davanti all’osservatore un bersaglio già individuato. Il riferimento la pone in relazione opposta all’evanescenza. Per progettare un’apparizione occorre conoscere in anticipo struttura, spazio e dettagli di ciò che si desidera ottenere.\nGli oggetti evocati non sono considerati permanenti. La loro presenza temporanea va distinta dalla creazione di vita o dalla produzione di risorse autentiche senza limiti. Restano validi i confini discussi nei fondamenti.\nUn allievo deve saper ricostruire la sequenza dell’effetto: c’era un bersaglio che è cambiato, oppure è apparso un nuovo oggetto? La lezione apre il quinto anno con progetti e classificazioni, senza aggiungere formule di evanescenza non fornite dal libro.\nObiettivo\nL’allievo distingue apparizione, trasformazione e scomparsa senza attribuire permanenza automatica all’effetto.\nRiferimento: 12–13, evocazione","title":"Portare all’esistenza","folio":"71","kind":"theory"},{"image":"pages/page-72.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno V · Lectio 1\nL’esercizio e il giudizio\nPortare all’esistenza · Scheda operativa\nPortare all’esistenza · Scheda operativa\nPreparazione\nCasi scritti di trasformazione, evocazione e scomparsa.\n1. Classifica tre scene indicando il punto di partenza di ciascun effetto.\n2. Progetta un piccolo oggetto evocato descrivendone tutti i parametri osservabili.\n3. Spiega quali prove useresti per seguirne presenza e durata.\nControllo\nL’allievo distingue apparizione, trasformazione e scomparsa senza attribuire permanenza automatica all’effetto.\nDomanda di ripasso\nUn oggetto compare sul tavolo: la sua comparsa dimostra che durerà per sempre?\nRagionamento\nNo. Nel riferimento l’evocazione produce effetti temporanei da osservare e controllare.","title":"Portare all’esistenza · Esercizio e ripasso","folio":"72","kind":"theory"},{"image":"pages/page-73.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno V · Settimana I\nUn bouquet temporaneo\nOrchideus\nOrchideus\nOrchideus fa apparire un piccolo mazzo di fiori dalla punta della bacchetta. È un esempio adatto a studiare come una forma apparentemente delicata richieda comunque un progetto ordinato: gambi, foglie, petali e proporzioni devono essere coerenti.\nIl colore generale non esaurisce il lavoro. Ogni petalo presenta sfumature e luminosità; se la tonalità è trascurata, il bouquet può risultare uniforme e poco definito. Scegliere pochi dettagli ben conosciuti permette di controllare meglio la visualizzazione.\nLa durata limitata distingue questi fiori da una pianta coltivata. La loro comparsa non dimostra la creazione di vita naturale. La lezione lavora sulla formula principale, osservando prima una dimostrazione e passando a un tentativo guidato solo quando il progetto è chiaro.\nObiettivo\nIl bouquet è coerente nel disegno delle parti e l’allievo ne riconosce il carattere temporaneo.\nRiferimento: 13, Orchideus","title":"Un bouquet temporaneo","folio":"73","kind":"theory"},{"image":"pages/page-74.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno V · Lectio 2\nOrchideus\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nFa apparire un mazzo di fiori dalla bacchetta. Nel modello del corso il bouquet è temporaneo.\nNozioni da spiegare\nGambi, foglie e petali costituiscono una struttura articolata. Il colore generale si distingue dalle sfumature che rendono definito ogni elemento.\nEsempio da discutere in aula\nProgettare un bouquet semplice su pergamena. Far spiegare perché pochi fiori ben descritti possano risultare più coerenti di un insieme complesso e vago.\nDomanda alla classe\nLa comparsa di fiori dimostra che sia nata una pianta coltivabile?\nRisposta ragionata\nNo. Nel modello del volume si studia un’apparizione temporanea, distinta dalla crescita naturale.","title":"Orchideus","folio":"74","kind":"spell"},{"image":"pages/page-75.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno V · Lectio 2\nL’esercizio e il giudizio\nUn bouquet temporaneo · Scheda operativa\nUn bouquet temporaneo · Scheda operativa\nPreparazione\nDisegno di un bouquet semplice e spazio libero davanti al banco.\n1. Scegli un fiore semplice e descrivi gambo, foglia e petalo.\n2. Definisci due colori e le sfumature che rendono riconoscibile il risultato.\n3. Esegui Orchideus sotto guida o analizzane la dimostrazione, registrando completezza e durata.\nControllo\nIl bouquet è coerente nel disegno delle parti e l’allievo ne riconosce il carattere temporaneo.\nDomanda di ripasso\nPetali di colore corretto ma privi di dettagli indicano un problema di quale parametro?\nRagionamento\nDella tonalità, quando mancano sfumature, luminosità e particolari della superficie.","title":"Un bouquet temporaneo · Esercizio e ripasso","folio":"75","kind":"theory"},{"image":"pages/page-76.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno V · Settimana II\nCongiunzione e contenimento\nEpoximise e Incarcerous\nEpoximise e Incarcerous\nEpoximise unisce due oggetti mediante una superficie adesiva. L’effetto centrale riguarda la proprietà della zona di contatto: la semplice vicinanza degli oggetti non equivale a una congiunzione riuscita.\nIncarcerous genera funi destinate a contenere un bersaglio. Si distingue da Incarcifors, che modifica un oggetto già presente in una gabbia. La somiglianza del fine non deve far confondere origine, struttura e formula.\nIl laboratorio principale usa Epoximise su due campioni sacrificabili predisposti dal docente. Le funi si studiano mediante un bersaglio inanimato di dimostrazione, senza pratiche sui compagni. La riuscita si giudica dalla corrispondenza con l’area di unione prevista.\nObiettivo\nLa congiunzione è localizzata e le formule di contenimento vengono distinte correttamente.\nRiferimento: 13, Epoximise e Incarcerous","title":"Congiunzione e contenimento","folio":"76","kind":"theory"},{"image":"pages/page-77.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno V · Lectio 3\nEpoximise\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nFa aderire due oggetti attraverso una zona di contatto, unendoli secondo l’effetto descritto dal riferimento.\nNozioni da spiegare\nIl contatto fisico non equivale ad adesione. Il progetto riguarda la proprietà della superficie e l’area nella quale si vuole ottenere la congiunzione.\nEsempio da discutere in aula\nSegnare su due campioni la superficie da unire. Far descrivere quali zone debbano aderire e quali rimanere separate.\nDomanda alla classe\nAccostare gli oggetti dimostra già una congiunzione riuscita?\nRisposta ragionata\nNo. Bisogna verificare il legame nella zona prevista.","title":"Epoximise","folio":"77","kind":"spell"},{"image":"pages/page-78.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno V · Lectio 3\nIncarcerous\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nFa apparire funi destinate a legare o contenere il bersaglio. Il catalogo della scuola usa la denominazione Incarcerous.\nNozioni da spiegare\nIl libro di riferimento usa anche la variante Incarceramus. Qui la voce viene normalizzata al catalogo; si distingue da Incarcifors, che trasforma un oggetto in una gabbia.\nEsempio da discutere in aula\nConfrontare su disegno una gabbia ottenuta da un oggetto e funi apparse attorno a un manichino. Ricostruire l’origine dei due effetti.\nDomanda alla classe\nIncarcerous e Incarcifors producono lo stesso tipo di intervento?\nRisposta ragionata\nNo. Il primo evoca funi; il secondo trasforma materia presente in una gabbia.","title":"Incarcerous","folio":"78","kind":"spell"},{"image":"pages/page-79.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno V · Lectio 3\nL’esercizio e il giudizio\nCongiunzione e contenimento · Scheda operativa\nCongiunzione e contenimento · Scheda operativa\nPreparazione\nDue campioni da unire e disegno dell’area di contatto.\n1. Segna la superficie che deve aderire e descrivi ciò che deve rimanere libero.\n2. Osserva o esegui Epoximise sotto guida, verificando l’unione prevista.\n3. Confronta Incarcerous e Incarcifors in una tabella origine–risultato.\nControllo\nLa congiunzione è localizzata e le formule di contenimento vengono distinte correttamente.\nDomanda di ripasso\nUna gabbia e una fune possono avere lo stesso scopo: perché non sono lo stesso procedimento?\nRagionamento\nIncarcifors trasforma un oggetto in gabbia; Incarcerous evoca funi. Cambiano origine ed effetto.","title":"Congiunzione e contenimento · Esercizio e ripasso","folio":"79","kind":"theory"},{"image":"pages/page-80.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno V · Settimana II\nLeggere un effetto ambiguo\nMelofors e sintesi dell’evocazione\nMelofors e sintesi dell’evocazione\nIl libro riporta due interpretazioni di Melofors: comparsa di una zucca attorno alla testa oppure trasformazione della testa stessa. Questa divergenza non va nascosta: insegna a distinguere un’osservazione da una spiegazione non ancora accertata.\nNel primo caso si descrive un’apparizione che ricopre il bersaglio; nel secondo una trasformazione umana, con requisiti ben diversi. Un unico risultato visivo può quindi suggerire meccanismi distinti. Non è corretto scegliere la spiegazione solo perché sembra più comoda.\nLa lezione rimane teorica e conclude l’anno confrontando Orchideus, Epoximise, Incarcerous e Melofors. Il criterio comune è descrivere origine, risultato, parametri e limiti prima di formulare il giudizio.\nObiettivo\nL’allievo segnala l’incertezza invece di trasformarla in una regola arbitraria.\nRiferimento: 13, Melofors","title":"Leggere un effetto ambiguo","folio":"80","kind":"theory"},{"image":"pages/page-81.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno V · Lectio 4\nMelofors\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nÈ associato alla comparsa di una testa di zucca o di una zucca che avvolge il capo. Il riferimento propone due spiegazioni del meccanismo.\nNozioni da spiegare\nLa forma finale non permette da sola di scegliere tra evocazione e trasformazione umana. Il corso conserva questa distinzione come problema interpretativo.\nEsempio da discutere in aula\nPresentare le due descrizioni senza eseguire la formula. Chiedere quali osservazioni aggiuntive permetterebbero di distinguerle.\nDomanda alla classe\nVedere una zucca prova che la testa sia stata trasformata?\nRisposta ragionata\nNo. Potrebbe trattarsi di un involucro apparso attorno al capo: servono informazioni sull’origine dell’effetto.","title":"Melofors","folio":"81","kind":"spell"},{"image":"pages/page-82.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno V · Lectio 4\nL’esercizio e il giudizio\nLeggere un effetto ambiguo · Scheda operativa\nLeggere un effetto ambiguo · Scheda operativa\nPreparazione\nDue descrizioni alternative dello stesso effetto e schede delle formule del quinto anno.\n1. Scrivi separatamente ciò che è osservato e ciò che è ipotizzato nel caso Melofors.\n2. Indica quali informazioni servirebbero per distinguere le due interpretazioni.\n3. Riclassifica le formule dell’anno motivando ogni scelta.\nControllo\nL’allievo segnala l’incertezza invece di trasformarla in una regola arbitraria.\nDomanda di ripasso\nDue spiegazioni danno lo stesso aspetto esteriore: quale va accettata senza altre prove?\nRagionamento\nNessuna delle due automaticamente. Servono informazioni sull’origine e sulla natura dell’effetto.\nFine del ciclo di due settimane. Si prosegue con il VI anno.","title":"Leggere un effetto ambiguo · Esercizio e ripasso","folio":"82","kind":"theory"},{"image":"pages/page-83.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VI\nLa forma umana\nAnnus Sextus\nAnnus Sextus\nStudiare le trasformazioni umane, i loro requisiti e le procedure di controllo.\nIl ciclo dell’annualità\nDue settimane. Due lezioni ogni settimana. Quattro incontri. Le schede delle formule sono letture della stessa lezione, non incontri aggiuntivi.","title":"La forma umana","folio":"83","kind":"divider"},{"image":"pages/page-84.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VI\nIl programma dell’anno\nDue settimane · Quattro lezioni\nDue settimane · Quattro lezioni\nSettimana I\nLezione 1 · Studiare il corpo 85\n
