Requisiti della Trasfigurazione umana · Crinus Muto\nLezione 2 · Mutazioni circoscritte e complete 88\nDensaugeo, Pullus e Paperante\nSettimana II\nLezione 3 · Anatomie lontane 93\nPiscofors, Entomorphis e Furitum\nLezione 4 · Copia e alterazione del volume 98\nGeminio e Inflatus\nTraguardo\nStudiare le trasformazioni umane, i loro requisiti e le procedure di controllo.\nOgni incontro comprende teoria, spiegazione delle formule ed esercizio. Le schede aggiunte appartengono alla stessa lezione. Dopo il quarto incontro si passa all’anno successivo.","title":"Il programma dell’anno","folio":"84","kind":"theory"},{"image":"pages/page-85.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VI · Settimana I\nStudiare il corpo\nRequisiti della Trasfigurazione umana · Crinus Muto\nRequisiti della Trasfigurazione umana · Crinus Muto\nLa Trasfigurazione umana richiede concentrazione elevata, dimestichezza e conoscenza anatomica. Il bersaglio non è un materiale intercambiabile: il progetto deve rispettare struttura, funzione e possibilità di ripristino.\nCrinus Muto cambia il colore dei capelli. Anche una modifica circoscritta richiede di distinguere tinta generale, radici, punte e sfumature. Una visualizzazione disordinata può produrre un effetto differente da quello previsto.\nLo studio del sesto anno non autorizza esperimenti spontanei sulle persone. L’attività comincia con un progetto su disegno; un’eventuale dimostrazione su un volontario appartiene al docente e richiede preparazione e controllo. Non si scambia una modifica cosmetica per una padronanza dell’intero corpo.\nObiettivo\nIl progetto separa colore e tonalità e riconosce i requisiti della pratica su persone.\nRiferimento: 14, cap. 1 e Crinus Muto","title":"Studiare il corpo","folio":"85","kind":"theory"},{"image":"pages/page-86.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VI · Lectio 1\nCrinus Muto\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nCambia il colore dei capelli. È una modifica circoscritta dell’aspetto, affrontata nel quadro della Trasfigurazione umana.\nNozioni da spiegare\nRadici, punte e ciocche possono avere sfumature diverse. La precisione cromatica non equivale alla padronanza di trasformazioni complete del corpo.\nEsempio da discutere in aula\nColorare uno schema di capelli annotando tinta e sfumature. Far spiegare perché una modifica limitata richieda comunque un progetto accurato.\nDomanda alla classe\nSaper cambiare il colore dei capelli dimostra padronanza dell’intera anatomia?\nRisposta ragionata\nNo. È un compito circoscritto, con parametri e difficoltà specifici.","title":"Crinus Muto","folio":"86","kind":"spell"},{"image":"pages/page-87.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VI · Lectio 1\nL’esercizio e il giudizio\nStudiare il corpo · Scheda operativa\nStudiare il corpo · Scheda operativa\nPreparazione\nSchema della capigliatura e campioni cromatici; attività progettuale.\n1. Definisci il colore iniziale e quello finale senza cambiare il volume dei capelli.\n2. Indica le differenze di tonalità tra radici e punte.\n3. Presenta al docente il progetto e spiega come riconosceresti un effetto parziale.\nControllo\nIl progetto separa colore e tonalità e riconosce i requisiti della pratica su persone.\nDomanda di ripasso\nSaper descrivere un nuovo colore basta a padroneggiare la Trasfigurazione umana?\nRagionamento\nNo. Restano necessari conoscenza anatomica, controllo, esperienza e preparazione del ripristino.","title":"Studiare il corpo · Esercizio e ripasso","folio":"87","kind":"theory"},{"image":"pages/page-88.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VI · Settimana I\nMutazioni circoscritte e complete\nDensaugeo, Pullus e Paperante\nDensaugeo, Pullus e Paperante\nDensaugeo modifica i denti del bersaglio, mostrando come un cambiamento localizzato possa incidere sulla funzione del corpo. Non è una formula da sperimentare tra compagni e viene studiata attraverso una descrizione diagnostica.\nPullus e Paperante sono presentati come trasformazioni in forme aviarie. Paperante conduce alla forma di un’anatra e richiede attenzione a proporzioni, becco, ali, zampe e piumaggio. La struttura umana iniziale è molto diversa dal risultato animale.\nL’essenza originaria resta il riferimento del manuale. La perdita temporanea della parola rende necessario un controllo esterno affidabile: il progetto deve includere chi supervisiona e come viene gestito il ripristino. La lezione è un confronto teorico, senza trasformazioni umane eseguite dagli allievi.\nObiettivo\nL’analisi distingue estensione, funzione e controllo senza ridurre la difficoltà alla sola dimensione.\nRiferimento: 14–16","title":"Mutazioni circoscritte e complete","folio":"88","kind":"theory"},{"image":"pages/page-89.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VI · Lectio 2\nDensaugeo\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nFa crescere i denti del bersaglio. Il cambiamento riguarda una parte del corpo e può interferire con le sue funzioni.\nNozioni da spiegare\nUna variazione di dimensione non è neutra quando coinvolge l’anatomia. Il corso distingue la descrizione dell’effetto dal permesso di sperimentarlo.\nEsempio da discutere in aula\nStudiare uno schema della dentatura e indicare quali funzioni possano essere coinvolte da una crescita anomala. La trattazione è teorica.\nDomanda alla classe\nIl fatto che cambi soltanto una parte del corpo rende semplice la valutazione?\nRisposta ragionata\nNo. Occorre considerare le relazioni con le altre strutture e con le funzioni del corpo.","title":"Densaugeo","folio":"89","kind":"spell"},{"image":"pages/page-90.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VI · Lectio 2\nPullus\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nApprofondimento teorico del riferimento\nChe cosa fa\nNel riferimento produce una trasformazione in forma aviaria. Il corso ne studia il confronto con le altre mutazioni del corpo.\nNozioni da spiegare\nUna trasformazione corporea completa richiede il confronto tra anatomia iniziale e finale. Non si riduce all’aggiunta di penne o al cambiamento del colore.\nEsempio da discutere in aula\nConfrontare su disegno arti, becco e proporzioni. Individuare perché la perdita della parola umana richieda supervisione esterna.\nDomanda alla classe\nUn rivestimento di piume basta a descrivere una trasformazione completa?\nRisposta ragionata\nNo. Devono essere considerate l’intera struttura e le condizioni del soggetto.","title":"Pullus","folio":"90","kind":"spell"},{"image":"pages/page-91.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VI · Lectio 2\nPaperante\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nNel riferimento trasforma il soggetto in una forma di anatra.\nNozioni da spiegare\nBecco, ali, zampe e piumaggio definiscono un’anatomia diversa da quella umana. Il corso studia anche la difficoltà di comunicazione e la necessità di prevedere il ripristino.\nEsempio da discutere in aula\nConfrontare la figura di un’anatra e quella umana su scheda, indicando le modifiche principali.\nDomanda alla classe\nPerché il progetto deve includere chi supervisiona?\nRisposta ragionata\nPerché il soggetto trasformato può non poter comunicare normalmente e richiede un controllo esterno.","title":"Paperante","folio":"91","kind":"spell"},{"image":"pages/page-92.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VI · Lectio 2\nL’esercizio e il giudizio\nMutazioni circoscritte e complete · Scheda operativa\nMutazioni circoscritte e complete · Scheda operativa\nPreparazione\nSchemi di forme umane e aviarie; tre casi diagnostici.\n1. Distingui una mutazione localizzata da una trasformazione dell’intero corpo.\n2. Indica le parti che cambiano maggiormente nel passaggio alla forma d’anatra.\n3. Ricostruisci un caso di effetto incompleto e proponi l’intervento del docente.\nControllo\nL’analisi distingue estensione, funzione e controllo senza ridurre la difficoltà alla sola dimensione.\nDomanda di ripasso\nUna modifica riguarda soltanto i denti: perché non è automaticamente trascurabile?\nRagionamento\nPerché anche una modifica localizzata può alterare funzioni corporee e richiedere un ripristino competente.","title":"Mutazioni circoscritte e complete · Esercizio e ripasso","folio":"92","kind":"theory"},{"image":"pages/page-93.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VI · Settimana II\nAnatomie lontane\nPiscofors, Entomorphis e Furitum\nPiscofors, Entomorphis e Furitum\nPiscofors conduce alla forma di un pesce: squame, proporzioni e struttura differiscono profondamente dalla forma umana. Il progetto deve essere pensato come trasformazione complessiva, non come semplice sostituzione della pelle.\nEntomorphis induce caratteristiche e comportamento da insetto secondo la descrizione del riferimento. Furitum conduce alla forma di un furetto. In entrambi i casi il limite alla comunicazione rende il controllo della situazione parte integrante dello studio.\nSi confrontano tre anatomie per capire perché la piccola taglia del risultato non coincida con una bassa difficoltà. Gli allievi lavorano su schemi e non tentano le formule su persone o animali. La capacità di riconoscere un problema viene prima della pretesa di produrlo.\nObiettivo\nL’allievo collega complessità anatomica e controllo senza equiparare piccolezza e facilità.\nRiferimento: 16, Piscofors, Entomorphis e Furitum","title":"Anatomie lontane","folio":"93","kind":"theory"},{"image":"pages/page-94.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VI · Lectio 3\nPiscofors\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nNel riferimento conduce il soggetto alla forma di un pesce.\nNozioni da spiegare\nSquame, pinne e proporzioni appartengono a un progetto complessivo. Una taglia finale piccola non elimina la distanza tra le anatomie confrontate.\nEsempio da discutere in aula\nStudiare due sagome, umana e ittica, e individuare le parti che cambiano disposizione e funzione. L’attività è teorica.\nDomanda alla classe\nLa piccola taglia del pesce rende automaticamente semplice la formula?\nRisposta ragionata\nNo. Conta la complessità delle modifiche e la differenza tra origine e risultato.","title":"Piscofors","folio":"94","kind":"spell"},{"image":"pages/page-95.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VI · Lectio 3\nEntomorphis\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nSecondo il riferimento induce caratteristiche e comportamento da insetto.\nNozioni da spiegare\nUna descrizione di tratti insettoidi va distinta dalla certezza di una trasformazione completa. Si analizzano soltanto le caratteristiche effettivamente riportate.\nEsempio da discutere in aula\nSeparare in una scheda aspetto esterno e comportamento, chiarendo quali informazioni non siano sufficienti a definire l’intera anatomia.\nDomanda alla classe\nOsservare un comportamento da insetto prova da solo una trasformazione completa?\nRisposta ragionata\nNo. Il comportamento è un dato distinto dalla struttura del corpo.","title":"Entomorphis","folio":"95","kind":"spell"},{"image":"pages/page-96.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VI · Lectio 3\nFuritum\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nNel riferimento conduce il soggetto alla forma di un furetto.\nNozioni da spiegare\nUna forma di mammifero mantiene alcune analogie generali, ma richiede comunque un nuovo progetto di proporzioni, arti e rivestimento.\nEsempio da discutere in aula\nConfrontare su schema la postura umana e quella del furetto. Far descrivere le differenze senza dedurre una difficoltà minima dalla parentela tra mammiferi.\nDomanda alla classe\nDue forme di mammifero hanno una struttura direttamente intercambiabile?\nRisposta ragionata\nNo. La categoria generale non sostituisce la conoscenza delle anatomie specifiche.","title":"Furitum","folio":"96","kind":"spell"},{"image":"pages/page-97.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VI · Lectio 3\nL’esercizio e il giudizio\nAnatomie lontane · Scheda operativa\nAnatomie lontane · Scheda operativa\nPreparazione\nTre schemi anatomici semplificati e una scheda dei cinque parametri.\n1. Scegli una delle tre forme e individua i maggiori cambiamenti strutturali.\n2. Distingui tinta generale e dettaglio del rivestimento esterno.\n3. Spiega come l’impossibilità di parlare cambi l’organizzazione della supervisione.\nControllo\nL’allievo collega complessità anatomica e controllo senza equiparare piccolezza e facilità.\nDomanda di ripasso\nUn furetto è più piccolo di un essere umano: la trasformazione richiede per questo poca concentrazione?\nRagionamento\nNo. La distanza tra le strutture e la precisione richiesta restano elevate.","title":"Anatomie lontane · Esercizio e ripasso","folio":"97","kind":"theory"},{"image":"pages/page-98.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VI · Settimana II\nCopia e alterazione del volume\nGeminio e Inflatus\nGeminio e Inflatus\nGeminio produce un duplicato che riprende l’aspetto dell’originale. Nel riferimento la copia non acquisisce automaticamente i poteri o il valore autentico dell’oggetto. La duplicazione non aggira i limiti già studiati su denaro e proprietà magiche.\nInflatus aumenta il volume del bersaglio ed è descritto come effetto offensivo. Viene analizzato soltanto in teoria. Una modifica dello spazio può influire sull’equilibrio e sulla funzione: conservare il colore non significa conservare tutte le condizioni iniziali.\nIl bilancio del sesto anno collega capacità e responsabilità. L’allievo deve saper distinguere somiglianza da equivalenza e conoscere i requisiti prima di lavorare su un corpo. Il laboratorio principale è una comparazione guidata di copia e originale su un oggetto ordinario.\nObiettivo\nIl giudizio non confonde copia visiva, autenticità e proprietà magiche.\nRiferimento: 16–17, Geminio e Inflatus","title":"Copia e alterazione del volume","folio":"98","kind":"theory"},{"image":"pages/page-99.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VI · Lectio 4\nGeminio\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nProduce una copia di un oggetto. Nel riferimento il duplicato ne riprende l’aspetto senza acquisire automaticamente valore e proprietà magiche dell’originale.\nNozioni da spiegare\nSomiglianza ed equivalenza sono diverse. Una copia esteticamente fedele non dimostra l’identità di funzione, autenticità o durata.\nEsempio da discutere in aula\nConfrontare la descrizione di un oggetto ordinario e di un manufatto magico. Elencare le proprietà che il solo aspetto non permetterebbe di verificare.\nDomanda alla classe\nUna copia visivamente perfetta garantisce ogni funzione dell’originale?\nRisposta ragionata\nNo. La somiglianza osservata non dimostra proprietà non verificate.","title":"Geminio","folio":"99","kind":"spell"},{"image":"pages/page-100.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VI · Lectio 4\nInflatus\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nGonfia il bersaglio aumentandone il volume. Il riferimento lo descrive come un effetto offensivo, trattato soltanto in teoria.\nNozioni da spiegare\nIl volume può cambiare senza una modifica analoga del colore. Quando il bersaglio è animato occorre considerare conseguenze su equilibrio e funzione.\nEsempio da discutere in aula\nConfrontare due sagome e individuare che cosa sia cambiato nello spazio occupato, distinguendolo dalla colorazione.\nDomanda alla classe\nConservare il colore significa conservare tutte le condizioni iniziali?\nRisposta ragionata\nNo. Dimensioni e funzioni possono essere alterate anche quando la tinta resta uguale.","title":"Inflatus","folio":"100","kind":"spell"},{"image":"pages/page-101.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VI · Lectio 4\nL’esercizio e il giudizio\nCopia e alterazione del volume · Scheda operativa\nCopia e alterazione del volume · Scheda operativa\nPreparazione\nOggetto semplice non prezioso; copia dimostrativa e scheda comparativa.\n1. Descrivi quali proprietà puoi osservare senza attribuire poteri alla copia.\n2. Confronta copia e originale senza usare denaro o manufatti incantati.\n3. Risolvi un caso scritto di aumento di volume e individua i parametri coinvolti.\nControllo\nIl giudizio non confonde copia visiva, autenticità e proprietà magiche.\nDomanda di ripasso\nUna copia di un oggetto incantato gli somiglia perfettamente: ne possiede necessariamente i poteri?\nRagionamento\nNo. Il riferimento distingue la duplicazione dell’aspetto dall’acquisizione delle proprietà magiche.\nFine del ciclo di due settimane. Si prosegue con il VII anno.","title":"Copia e alterazione del volume · Esercizio e ripasso","folio":"101","kind":"theory"},{"image":"pages/page-102.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VII\nIdentità e metamorfosi\nAnnus Septimus\nAnnus Septimus\nDistinguere capacità apprese, doti innate e maledizioni, senza confonderle con semplici incantesimi.\nIl ciclo dell’annualità\nDue settimane. Due lezioni ogni settimana. Quattro incontri. Le schede delle formule sono letture della stessa lezione, non incontri aggiuntivi.","title":"Identità e metamorfosi","folio":"102","kind":"divider"},{"image":"pages/page-103.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VII\nIl programma dell’anno\nDue settimane · Quattro lezioni\nDue settimane · Quattro lezioni\nSettimana I\nLezione 1 · L’animale e l’identità 104\nAnimagus\nLezione 2 · Trasformazioni e maledizioni 106\nAnimagus, licantropo e Maledictus\nSettimana II\nLezione 3 · Ripristinare la forma umana 108\nL’incantesimo Homosembiante\nLezione 4 · La dote che nasce con il mago 111\nMetamorphomagus e conclusione del volume\nTraguardo\nDistinguere capacità apprese, doti innate e maledizioni, senza confonderle con semplici incantesimi.\nOgni incontro comprende teoria, spiegazione delle formule ed esercizio. Le schede aggiunte appartengono alla stessa lezione. Dopo il quarto incontro si passa all’anno successivo.","title":"Il programma dell’anno","folio":"103","kind":"theory"},{"image":"pages/page-104.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VII · Settimana I\nL’animale e l’identità\nAnimagus\nAnimagus\nUn Animagus ha appreso a trasformarsi in un animale attraverso studio e pratica avanzati. Non si tratta di una dote acquisita leggendo una formula, né di un risultato garantito dal completamento delle lezioni scolastiche.\nLa forma animale è una sola e non viene scelta a piacimento. Nella trasformazione l’Animagus conserva la propria mente, ma non la normale parola umana. Il riferimento richiama inoltre l’obbligo di registrazione presso il Ministero.\nTra i precedenti storici compatibili con il corso figurano Falco Aesalon e i racconti legati a Lisette de Lapin. I casi di maghi vissuti dopo il 1890 non fanno parte di questa edizione. L’incontro è teorico: descrive un’abilità avanzata senza proporre un rituale per acquisirla.\nObiettivo\nL’allievo riconosce studio, forma unica e registrazione senza rivendicare l’abilità.\nRiferimento: 17–18, Animagus","title":"L’animale e l’identità","folio":"104","kind":"theory"},{"image":"pages/page-105.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VII · Lectio 1\nL’esercizio e il giudizio\nL’animale e l’identità · Scheda operativa\nL’animale e l’identità · Scheda operativa\nPreparazione\nScheda comparativa tra trasformazione tramite incantesimo e abilità Animagus.\n1. Elenca i tratti distintivi dell’Animagus senza confonderli con una formula temporanea.\n2. Spiega che cosa rimane della mente e che cosa cambia nella comunicazione.\n3. Distingui un precedente storico da una leggenda non verificata.\nControllo\nL’allievo riconosce studio, forma unica e registrazione senza rivendicare l’abilità.\nDomanda di ripasso\nStudiare il capitolo rende automaticamente Animagus?\nRagionamento\nNo. È un’abilità avanzata che richiede un percorso specifico, non il solo apprendimento teorico.","title":"L’animale e l’identità · Esercizio e ripasso","folio":"105","kind":"theory"},{"image":"pages/page-106.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VII · Settimana I\nTrasformazioni e maledizioni\nAnimagus, licantropo e Maledictus\nAnimagus, licantropo e Maledictus\nIl confronto tra Animagus e licantropo riguarda soprattutto volontarietà e lucidità. L’Animagus controlla una trasformazione appresa; la licantropia è una condizione diversa, legata a trasformazioni non governate nello stesso modo.\nIl Maledictus è descritto nel riferimento come una strega portatrice di una maledizione del sangue trasmessa lungo la linea materna. La possibilità iniziale di alternare le forme si perde progressivamente, fino alla trasformazione definitiva.\nSomiglianze esteriori non dimostrano una causa comune. Una forma animale può derivare da un’abilità, da una maledizione o da un incantesimo: prima di classificare servono informazioni su origine, controllo e reversibilità. Non si deducono diagnosi dall’aspetto di una persona.\nObiettivo\nL’allievo distingue le tre condizioni e riconosce i casi insufficientemente descritti.\nRiferimento: 18–19","title":"Trasformazioni e maledizioni","folio":"106","kind":"theory"},{"image":"pages/page-107.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VII · Lectio 2\nL’esercizio e il giudizio\nTrasformazioni e maledizioni · Scheda operativa\nTrasformazioni e maledizioni · Scheda operativa\nPreparazione\nTre casi anonimi scritti con informazioni su origine e controllo.\n1. Per ciascun caso indica se la trasformazione è appresa o legata a una condizione.\n2. Confronta volontarietà, lucidità e possibilità di ritorno.\n3. Segnala quali dati mancano prima di assegnare una categoria.\nControllo\nL’allievo distingue le tre condizioni e riconosce i casi insufficientemente descritti.\nDomanda di ripasso\nUna persona assume una forma animale: puoi concludere subito che sia un Animagus?\nRagionamento\nNo. Occorre conoscere causa, controllo e reversibilità della trasformazione.","title":"Trasformazioni e maledizioni · Esercizio e ripasso","folio":"107","kind":"theory"},{"image":"pages/page-108.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VII · Settimana II\nRipristinare la forma umana\nL’incantesimo Homosembiante\nL’incantesimo Homosembiante\nIl riferimento presenta l’incantesimo Homosembiante come mezzo per restituire la forma originaria a un essere umano trasfigurato. Non viene descritto come formula universale per ogni creatura o per ogni condizione di metamorfosi.\nLa formula riportata è “Animaleus Nobodyx”, con scansione “A-ni-mà-le-us Nò-bo-dyx”. Richiede una conoscenza accurata del soggetto e un’altissima concentrazione. La capacità di pronunciarla non equivale alla capacità di eseguirla correttamente.\nL’incontro è dedicato a diagnosi e supervisione: identificare un umano trasfigurato, ricostruire la forma iniziale e affidare il ripristino al docente competente. Non si estende arbitrariamente la formula alle maledizioni ereditarie o all’acquisizione di abilità.\nObiettivo\nIl piano identifica bersaglio e limiti della formula e assegna l’intervento a chi possiede la preparazione necessaria.\nRiferimento: 19, cap. 3","title":"Ripristinare la forma umana","folio":"108","kind":"theory"},{"image":"pages/page-109.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VII · Lectio 3\nHomosembiante · Animaleus Nobodyx\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nLezione della materia\nChe cosa fa\nNel riferimento restituisce la forma umana originaria a un essere umano trasfigurato. La formula riportata è Animaleus Nobodyx.\nNozioni da spiegare\nIl ripristino richiede di riconoscere il soggetto e la trasformazione subita. Non viene esteso automaticamente a doti innate, licantropia o maledizioni ereditarie.\nEsempio da discutere in aula\nAnalizzare un caso scritto distinguendo umano trasfigurato, Animagus e condizione ereditaria. Stabilire quali informazioni occorrano al docente prima del ripristino.\nDomanda alla classe\nConoscere la formula basta a eseguire il ripristino?\nRisposta ragionata\nNo. Servono preparazione avanzata, conoscenza del soggetto e controllo dell’intervento.","title":"Homosembiante · Animaleus Nobodyx","folio":"109","kind":"spell"},{"image":"pages/page-110.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VII · Lectio 3\nL’esercizio e il giudizio\nRipristinare la forma umana · Scheda operativa\nRipristinare la forma umana · Scheda operativa\nPreparazione\nScheda dello stato originario e caso scritto di trasfigurazione umana.\n1. Individua il soggetto originario e le modifiche subite.\n2. Ricostruisci i parametri che il ripristino dovrebbe recuperare.\n3. Spiega perché la procedura non va presentata come cura universale di ogni metamorfosi.\nControllo\nIl piano identifica bersaglio e limiti della formula e assegna l’intervento a chi possiede la preparazione necessaria.\nDomanda di ripasso\nLa formula è indicata per un animale che non deriva dalla trasfigurazione di un essere umano?\nRagionamento\nNo. Il riferimento la riserva al recupero della forma di esseri umani trasfigurati.","title":"Ripristinare la forma umana · Esercizio e ripasso","folio":"110","kind":"theory"},{"image":"pages/page-111.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VII · Settimana II\nLa dote che nasce con il mago\nMetamorphomagus e conclusione del volume\nMetamorphomagus e conclusione del volume\nIl Metamorphomagus possiede fin dalla nascita una rara capacità di modificare il proprio aspetto senza bacchetta. Non apprende questa dote nello stesso modo in cui si studia una formula e non diventa automaticamente Animagus.\nLineamenti, colorazione e parti dell’aspetto possono mutare; controllo emotivo e pratica aiutano a governare la capacità. Il riferimento distingue la modifica dell’anatomia esterna dall’acquisizione di nuove funzioni interne: imitare un tratto animale non equivale a possederne tutte le capacità.\nL’Animagus assume una forma animale completa e unica; il Metamorphomagus varia il proprio aspetto umano senza diventare per questo un animale completo. Il percorso si conclude con un confronto motivato fra trasformazione, evocazione, animazione, abilità e condizione ereditaria: conoscere la differenza è il risultato delle sette annualità.\nObiettivo\nL’allievo distingue dote innata e abilità appresa e conclude il percorso con una classificazione ragionata.\nRiferimento: 19–20, cap. 4","title":"La dote che nasce con il mago","folio":"111","kind":"theory"},{"image":"pages/page-112.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAnno VII · Lectio 4\nL’esercizio e il giudizio\nLa dote che nasce con il mago · Scheda operativa\nLa dote che nasce con il mago · Scheda operativa\nPreparazione\nSchede degli argomenti dei sette anni e quaderno personale.\n1. Confronta origine, uso della bacchetta e risultato di Animagus e Metamorphomagus.\n2. Spiega perché una branchia apparente non dimostra la capacità di respirare sott’acqua.\n3. Scegli un esempio per ciascun ramo studiato e motivane classificazione e limiti.\nControllo\nL’allievo distingue dote innata e abilità appresa e conclude il percorso con una classificazione ragionata.\nDomanda di ripasso\nModificare l’aspetto fino a somigliare a un’altra persona equivale a cambiare la propria identità originaria?\nRagionamento\nNo. L’apparenza muta, ma non dimostra il cambiamento dell’identità o dell’essenza originaria.\nFine del ciclo di due settimane. Il percorso dei sette anni è concluso.","title":"La dote che nasce con il mago · Esercizio e ripasso","folio":"112","kind":"theory"},{"image":"pages/page-113.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nLexicon\nIl lessico della forma\nParole da usare con precisione\nParole da usare con precisione\nTrasfigurazione\nModifica di un bersaglio presente secondo un risultato progettato.\nEvocazione\nApparizione di un risultato temporaneo; non equivale alla creazione illimitata di vita o risorse.\nAnimazione\nMovimento imposto a un manufatto, senza attribuirgli volontà autonoma.\nDetrasfigurazione\nRipristino o correzione di un effetto trasfigurativo.\nPotenza, durata, efficacia\nCoesione della forma, tempo dell’effetto e corrispondenza al progetto sono criteri distinti.\nChartanimus\nEsempio complementare del riferimento: una figura animale di carta conserva l’essenza cartacea. Non sostituisce le tre formule del primo anno assegnate dalla scuola.","title":"Il lessico della forma","folio":"113","kind":"theory"},{"image":"pages/page-114.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nAppendice · Ordinamento\nLe formule del primo anno\nL’insegnamento della scuola e la struttura del volume\nL’insegnamento della scuola e la struttura del volume\nLezioni di Trasfigurazione\nColovaria, Aguamenti e Avis risultano assegnati al primo anno nelle lezioni della scuola. La prima settimana prepara il metodo e il mutamento cromatico; la seconda affronta Aguamenti e Avis, con il ripasso dei limiti.\nIl ruolo del riferimento\nIl libro «Trasfigurazione» costituisce la base teorica. Le lezioni della scuola definiscono invece la collocazione delle formule nel programma. Avis viene anticipato al primo anno; il confronto con Avifors resta un approfondimento successivo.\nEdizione e attribuzione\nArs Transfigurationis è un volume personale di Edmund Valemont, preparato per l’esperienza roleplay di NightFall. Le attività sono proposte didattiche originali. I riferimenti a personaggi o avvenimenti posteriori al 1890 sono esclusi.\nCreato per NightFall da Razor. Progetto amatoriale, non ufficiale.","title":"Le formule del primo anno","folio":"114","kind":"theory"},{"image":"pages/page-115.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nRepertorio · Esempio complementare del riferimento\nChartanimus\nLa formula · Effetto e nozioni per la lezione\nLa formula · Effetto e nozioni per la lezione\nEsempio complementare del riferimento\nChe cosa fa\nNel riferimento trasforma un foglio in una figura animale di carta animata. Il materiale rimane riconoscibile come carta.\nNozioni da spiegare\nPieghe, appoggi e proporzioni danno una struttura tridimensionale. Il movimento magico si distingue dalla creazione di vita naturale.\nEsempio da discutere in aula\nConfrontare un foglio disteso e il disegno della figura finale. Individuare quali parti debbano cambiare disposizione senza inventare nuovo materiale.\nDomanda alla classe\nUna figura cartacea che si muove è diventata un animale naturale?\nRisposta ragionata\nNo. Nel modello del riferimento conserva la natura cartacea, pur essendo animata.","title":"Chartanimus","folio":"115","kind":"spell"},{"image":"pages/page-116.svg?v=20261118-nozioni1","text":"ARS TRANSFIGURATIONIS\nFinis\nLa forma muta.\nIl metodo rimane.\nIl metodo rimane.\nSette annualità. Quattordici settimane. Ventotto lezioni per distinguere ciò che cambia da ciò che rimane.\nEdmund Valemont\nHogwarts · MDCCCXC","title":"La forma muta.","folio":"116","kind":"theory"},{"image":"pages/page-117.svg?v=20261118-nozioni1","text":"Controguardia posteriore marmorizzata.","title":"Controguardia posteriore","folio":"Controguardia
